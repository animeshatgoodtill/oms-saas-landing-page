<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 380" role="img" aria-labelledby="d6title d6desc">
<title id="d6title">An asset's status through its life</title>
<desc id="d6desc">A horizontal chain: Draft, added from the field and awaiting review, moves to Active. From Active it can branch to Maintenance, which returns to Active when finished; to Missing, which stays on the register but is highlighted; or to Decommissioned, which is kept for history, taken off field lists and pre-loading, and is what Delete does too. Caption: nothing is ever really deleted, status is what changes.</desc>
<style>
.lbl{font-family:Manrope,'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;}
.mono{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;}
.title{font-size:14px;font-weight:600;fill:#141619;}
.body{font-size:12.5px;fill:#141619;}
.note{font-size:11px;fill:#586070;}
.cap{font-size:13px;fill:#586070;}
.box{fill:#FFFFFF;stroke:#E1E5EA;stroke-width:1;}
.line{stroke:#586070;stroke-width:1.5;fill:none;}
</style>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#586070"/>
</marker>
</defs>

<rect x="40" y="150" width="160" height="56" rx="4" class="box"/>
<text x="120" y="183" text-anchor="middle" class="lbl title" style="font-size:13px;">Draft</text>
<rect x="40" y="216" width="160" height="38" rx="4" fill="#F1F3F5"/>
<text x="120" y="230" text-anchor="middle" class="lbl" style="font-size:10px;fill:#586070;">from the field,</text>
<text x="120" y="243" text-anchor="middle" class="lbl" style="font-size:10px;fill:#586070;">awaiting review</text>

<path d="M200,178 H260" class="line" marker-end="url(#ar)"/>

<rect x="260" y="150" width="160" height="56" rx="4" class="box"/>
<text x="340" y="183" text-anchor="middle" class="lbl title" style="font-size:13px;">Active</text>

<!-- branches -->
<path d="M420,178 H460 V88 H520" class="line" marker-end="url(#ar)"/>
<path d="M420,178 H520" class="line" marker-end="url(#ar)"/>
<path d="M420,178 H460 V305 H520" class="line" marker-end="url(#ar)"/>

<!-- back arrow maintenance -> active -->
<path d="M600,116 C600,132 350,132 340,150" class="line" marker-end="url(#ar)" fill="none"/>

<rect x="520" y="60" width="180" height="56" rx="4" class="box"/>
<text x="610" y="93" text-anchor="middle" class="lbl title" style="font-size:13px;">Maintenance</text>

<rect x="520" y="150" width="180" height="56" rx="4" fill="#FBF0D9" stroke="#E1E5EA" stroke-width="1"/>
<text x="610" y="183" text-anchor="middle" class="lbl title" style="font-size:13px;fill:#8A5A00;">Missing</text>
<text x="520" y="228" class="lbl note">stays on the register, highlighted</text>

<rect x="520" y="270" width="180" height="70" rx="4" fill="#FBE6E4" stroke="#E1E5EA" stroke-width="1"/>
<text x="610" y="298" text-anchor="middle" class="lbl title" style="font-size:13px;fill:#B42318;">Decommissioned</text>
<text x="536" y="315" class="lbl" style="font-size:10.5px;fill:#B42318;">kept for history; off field lists</text>
<text x="536" y="329" class="lbl" style="font-size:10.5px;fill:#B42318;">and pre-loading; Delete does the same</text>

<text x="520" y="366" text-anchor="middle" class="lbl cap">Nothing is ever really deleted &#8212; status is what changes.</text>
</svg>
