<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 720" role="img" aria-labelledby="dl2title dl2desc">
<title id="dl2title">Can I delete this defect?</title>
<desc id="dl2desc">A top-to-bottom decision flow. Is it Resolved? If yes, re-open it first. Is it on a quote? If yes, remove it from the quote first. Has a remedial job been raised for it? If yes, it can't be deleted. Was it raised from an alarm-monitoring case? If yes, it can't be deleted here. Is it on a completed Remedial Scope sheet? If yes, revert the sheet to draft first. Did you raise it, or are you office with delete rights? If no, only the person who raised it or the office can delete it, and no Delete option is shown. Are you online? If no, deleting needs a connection. If every check passes, delete the defect: confirm, optionally with its photos. A legend marks amber outcomes as do this first then try again, grey as stops here, and green as deleted. Caption: work down the checks; the first one that stops you says what to do next.</desc>
<style>
.lbl{font-family:Manrope,'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;}
.title{font-size:13.5px;font-weight:600;fill:#141619;}
.body{font-size:12.5px;fill:#141619;}
.note{font-size:11.5px;fill:#586070;}
.yn{font-size:11px;font-weight:600;fill:#586070;}
.cap{font-size:13px;fill:#586070;}
.box{fill:#FFFFFF;stroke:#E1E5EA;stroke-width:1;}
.chip{fill:#F1F3F5;}
.warn{fill:#FBF0D9;}
.warnT{font-size:13.5px;font-weight:600;fill:#8A5A00;}
.stopT{font-size:13.5px;font-weight:600;fill:#141619;}
.line{stroke:#586070;stroke-width:1.5;fill:none;}
</style>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#586070"/>
</marker>
<marker id="arOk" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#15803D"/>
</marker>
</defs>

<!-- start -->
<rect x="180" y="40" width="240" height="36" rx="18" class="chip"/>
<text x="300" y="63" text-anchor="middle" class="lbl title">You want to delete a defect</text>
<path d="M300,76 V100" class="line" marker-end="url(#ar)"/>

<!-- Q1 -->
<rect x="120" y="100" width="360" height="44" rx="4" class="box"/>
<text x="136" y="127" class="lbl title">Is it Resolved?</text>
<path d="M480,122 H580" class="line" marker-end="url(#ar)"/>
<text x="530" y="115" text-anchor="middle" class="lbl yn">yes</text>
<rect x="580" y="100" width="360" height="44" rx="4" class="warn"/>
<text x="596" y="119" class="lbl warnT">Re-open it first</text>
<text x="596" y="135" class="lbl note">resolved defects are the site's history</text>
<path d="M300,144 V168" class="line" marker-end="url(#ar)"/>
<text x="310" y="161" class="lbl yn">no</text>

<!-- Q2 -->
<rect x="120" y="168" width="360" height="44" rx="4" class="box"/>
<text x="136" y="195" class="lbl title">Is it on a quote?</text>
<path d="M480,190 H580" class="line" marker-end="url(#ar)"/>
<text x="530" y="183" text-anchor="middle" class="lbl yn">yes</text>
<rect x="580" y="168" width="360" height="44" rx="4" class="warn"/>
<text x="596" y="195" class="lbl warnT">Remove it from the quote first</text>
<path d="M300,212 V236" class="line" marker-end="url(#ar)"/>
<text x="310" y="229" class="lbl yn">no</text>

<!-- Q3 -->
<rect x="120" y="236" width="360" height="44" rx="4" class="box"/>
<text x="136" y="263" class="lbl title">Has a remedial job been raised for it?</text>
<path d="M480,258 H580" class="line" marker-end="url(#ar)"/>
<text x="530" y="251" text-anchor="middle" class="lbl yn">yes</text>
<rect x="580" y="236" width="360" height="44" rx="4" class="chip"/>
<text x="596" y="263" class="lbl stopT">Can't delete</text>
<path d="M300,280 V304" class="line" marker-end="url(#ar)"/>
<text x="310" y="297" class="lbl yn">no</text>

<!-- Q4 -->
<rect x="120" y="304" width="360" height="44" rx="4" class="box"/>
<text x="136" y="331" class="lbl title">Raised from an alarm-monitoring case?</text>
<path d="M480,326 H580" class="line" marker-end="url(#ar)"/>
<text x="530" y="319" text-anchor="middle" class="lbl yn">yes</text>
<rect x="580" y="304" width="360" height="44" rx="4" class="chip"/>
<text x="596" y="331" class="lbl stopT">Can't delete here</text>
<path d="M300,348 V372" class="line" marker-end="url(#ar)"/>
<text x="310" y="365" class="lbl yn">no</text>

<!-- Q5 -->
<rect x="120" y="372" width="360" height="44" rx="4" class="box"/>
<text x="136" y="399" class="lbl title">On a completed Remedial Scope sheet?</text>
<path d="M480,394 H580" class="line" marker-end="url(#ar)"/>
<text x="530" y="387" text-anchor="middle" class="lbl yn">yes</text>
<rect x="580" y="372" width="360" height="44" rx="4" class="warn"/>
<text x="596" y="391" class="lbl warnT">Revert the sheet to draft first</text>
<text x="596" y="407" class="lbl note">then delete the defect</text>
<path d="M300,416 V440" class="line" marker-end="url(#ar)"/>
<text x="310" y="433" class="lbl yn">no</text>

<!-- Q6 -->
<rect x="120" y="440" width="360" height="44" rx="4" class="box"/>
<text x="136" y="459" class="lbl title">Did you raise it?</text>
<text x="136" y="475" class="lbl note">or are you office with delete rights?</text>
<path d="M480,462 H580" class="line" marker-end="url(#ar)"/>
<text x="530" y="455" text-anchor="middle" class="lbl yn">no</text>
<rect x="580" y="440" width="360" height="44" rx="4" class="chip"/>
<text x="596" y="459" class="lbl stopT">Only the person who raised it, or the office</text>
<text x="596" y="475" class="lbl note">no Delete option is shown</text>
<path d="M300,484 V508" class="line" marker-end="url(#ar)"/>
<text x="310" y="501" class="lbl yn">yes</text>

<!-- Q7 -->
<rect x="120" y="508" width="360" height="44" rx="4" class="box"/>
<text x="136" y="535" class="lbl title">Are you online?</text>
<path d="M480,530 H580" class="line" marker-end="url(#ar)"/>
<text x="530" y="523" text-anchor="middle" class="lbl yn">no</text>
<rect x="580" y="508" width="360" height="44" rx="4" class="warn"/>
<text x="596" y="527" class="lbl warnT">Needs a connection</text>
<text x="596" y="543" class="lbl note">try again once you're back online</text>
<path d="M300,552 V580" stroke="#15803D" stroke-width="2" fill="none" marker-end="url(#arOk)"/>
<text x="310" y="569" class="lbl yn" style="fill:#15803D;">yes</text>

<!-- final yes -->
<rect x="120" y="580" width="360" height="56" rx="4" fill="#E4F3E9" stroke="#15803D" stroke-width="1.5"/>
<text x="136" y="604" class="lbl title" style="fill:#15803D;font-size:14.5px;">Delete defect</text>
<text x="136" y="623" class="lbl" style="font-size:12px;fill:#15803D;">Confirm, optionally with its photos</text>

<!-- legend -->
<rect x="580" y="584" width="14" height="14" rx="3" class="warn"/>
<text x="604" y="595" class="lbl note">Do this first, then try again</text>
<rect x="580" y="606" width="14" height="14" rx="3" class="chip" stroke="#E1E5EA"/>
<text x="604" y="617" class="lbl note">Stops here</text>
<rect x="580" y="628" width="14" height="14" rx="3" fill="#E4F3E9" stroke="#15803D"/>
<text x="604" y="639" class="lbl note">Deleted</text>

<text x="520" y="690" text-anchor="middle" class="lbl cap">Work down the checks: the first one that stops you says what to do next.</text>
</svg>
