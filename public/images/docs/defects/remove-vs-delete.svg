<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 480" role="img" aria-labelledby="dl3title dl3desc">
<title id="dl3title">Remove from scope versus Delete defect</title>
<desc id="dl3desc">A defect on a Remedial Scope sheet has two different buttons, shown as two lanes. Remove from scope, a grey button on each defect's scope row: the defect stays on the job's Defects card, tagged Removed from remedial scope, and stays on the site's defect register; it only leaves the scope list. Use it when the defect is real but doesn't belong in this scope. Delete defect, a red button reached by editing the defect: the defect is erased from the job, from its job sheets and from the site's defect register, and the audit log keeps a full copy. Use it when the defect was raised by mistake, on the wrong job or as a duplicate; the defect itself can't be restored. Caption: Remove from scope keeps the defect; Delete defect erases a mistake.</desc>
<style>
.lbl{font-family:Manrope,'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;}
.lane{font-size:11px;letter-spacing:.06em;font-weight:600;fill:#586070;text-transform:uppercase;}
.title{font-size:14px;font-weight:600;fill:#141619;}
.body{font-size:12.5px;fill:#141619;}
.note{font-size:11.5px;fill:#586070;}
.cap{font-size:13px;fill:#586070;}
.box{fill:#FFFFFF;stroke:#E1E5EA;stroke-width:1;}
.line{stroke:#586070;stroke-width:1.5;fill:none;}
</style>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#586070"/>
</marker>
</defs>

<!-- shared start -->
<rect x="360" y="32" width="320" height="44" rx="4" class="box"/>
<text x="520" y="59" text-anchor="middle" class="lbl title">A defect on a Remedial Scope sheet</text>
<path d="M520,76 V96 H264 V120" class="line" marker-end="url(#ar)"/>
<path d="M520,96 H776 V120" class="line" marker-end="url(#ar)"/>

<!-- ============ LEFT LANE: REMOVE FROM SCOPE ============ -->
<rect x="16" y="120" width="496" height="310" fill="#F7F9FB"/>
<text x="32" y="142" class="lbl lane">Remove from scope</text>

<!-- button mock -->
<rect x="32" y="156" width="186" height="34" rx="6" fill="#FFFFFF" stroke="#E1E5EA"/>
<path d="M46,167 h2 M52,167 h10 M46,173 h2 M52,173 h10 M46,179 h2 M52,179 h10" stroke="#586070" stroke-width="1.6" stroke-linecap="round"/>
<text x="72" y="178" class="lbl" style="font-size:12.5px;font-weight:600;fill:#141619;">Remove from scope</text>
<text x="234" y="170" class="lbl note">grey, not red,</text>
<text x="234" y="185" class="lbl note">on each defect's scope row</text>

<!-- outcomes -->
<circle cx="44" cy="214" r="8" fill="#E4F3E9"/>
<path d="M40,214 l3,3 l5,-6" stroke="#15803D" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="62" y="218.5" class="lbl body">Stays on the job's Defects card</text>
<text x="62" y="236" class="lbl note">tagged &#8220;Removed from remedial scope&#8221;</text>

<circle cx="44" cy="264" r="8" fill="#E4F3E9"/>
<path d="M40,264 l3,3 l5,-6" stroke="#15803D" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="62" y="268.5" class="lbl body">Stays on the site's defect register</text>

<circle cx="44" cy="300" r="8" fill="#F1F3F5" stroke="#E1E5EA"/>
<path d="M40,300 h8" stroke="#586070" stroke-width="1.8" stroke-linecap="round"/>
<text x="62" y="304.5" class="lbl body">Only leaves the scope list</text>

<rect x="32" y="346" width="464" height="72" rx="4" class="box"/>
<text x="48" y="368" class="lbl lane">Use it when</text>
<text x="48" y="390" class="lbl body">The defect is real, but it doesn't belong in this scope.</text>

<!-- ============ RIGHT LANE: DELETE DEFECT ============ -->
<rect x="528" y="120" width="496" height="310" fill="#F7F9FB"/>
<text x="544" y="142" class="lbl lane" style="fill:#B42318;">Delete defect</text>

<!-- button mock -->
<rect x="544" y="156" width="150" height="34" rx="6" fill="#B42318"/>
<text x="619" y="178" text-anchor="middle" class="lbl" style="font-size:12.5px;font-weight:600;fill:#FFFFFF;">Delete defect</text>
<text x="710" y="170" class="lbl note">Edit the defect, then</text>
<text x="710" y="185" class="lbl note">Delete defect and confirm</text>

<!-- outcomes -->
<circle cx="556" cy="214" r="8" fill="#FBE6E4"/>
<path d="M552.5,210.5 l7,7 M559.5,210.5 l-7,7" stroke="#B42318" stroke-width="1.8" stroke-linecap="round"/>
<text x="574" y="218.5" class="lbl body">Erased from the job</text>

<circle cx="556" cy="250" r="8" fill="#FBE6E4"/>
<path d="M552.5,246.5 l7,7 M559.5,246.5 l-7,7" stroke="#B42318" stroke-width="1.8" stroke-linecap="round"/>
<text x="574" y="254.5" class="lbl body">Erased from its job sheets</text>

<circle cx="556" cy="286" r="8" fill="#FBE6E4"/>
<path d="M552.5,282.5 l7,7 M559.5,282.5 l-7,7" stroke="#B42318" stroke-width="1.8" stroke-linecap="round"/>
<text x="574" y="290.5" class="lbl body">Erased from the site's defect register</text>

<circle cx="556" cy="322" r="8" fill="#E4EFF7"/>
<path d="M552,322 l3,3 l5,-6" stroke="#026A9F" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="574" y="326.5" class="lbl body">The audit log keeps a full copy</text>

<rect x="544" y="346" width="464" height="72" rx="4" class="box"/>
<text x="560" y="368" class="lbl lane">Use it when</text>
<text x="560" y="390" class="lbl body">It was raised by mistake &#8212; wrong job, or a duplicate.</text>
<text x="560" y="405" class="lbl note">The defect itself can't be restored.</text>

<text x="520" y="462" text-anchor="middle" class="lbl cap">Remove from scope keeps the defect; Delete defect erases a mistake.</text>
</svg>
