<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="sotitle sodesc">
<title id="sotitle">Where a new job's RAMS comes from</title>
<desc id="sodesc">First match wins, in this order: 1 anything typed on the job, 2 the site RAMS for this service type, 3 the site RAMS for all work at this site, 4 the service contract's saved RAMS, 5 the service type template, otherwise blank. Only approved versions of a site RAMS are used. Drafts never.</desc>
<style>
.lbl{font-family:Manrope,'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;}
.mono{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;}
.title{font-size:13.5px;font-weight:600;fill:#141619;}
.body{font-size:12.5px;fill:#141619;}
.note{font-size:11px;fill:#586070;}
.box{fill:#FFFFFF;stroke:#E1E5EA;stroke-width:1;}
.acc{fill:#E4EFF7;stroke:#026A9F;stroke-width:1.5;}
.line{stroke:#586070;stroke-width:1.5;fill:none;}
.tag{font-size:9.5px;font-weight:600;letter-spacing:.04em;}
</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#586070"/></marker></defs>
<text x="20" y="30" class="lbl title">Where a new job's RAMS comes from - first match wins</text>
<rect x="20" y="50" width="500" height="44" rx="4" class="box" />
<circle cx="44" cy="72" r="11" fill="#026A9F"/><text x="44" y="76" text-anchor="middle" class="lbl" style="font-size:12px;font-weight:700;fill:#fff">1</text>
<text x="68" y="70" class="lbl title">Anything typed on the job</text>
<text x="68" y="86" class="lbl note">Your own wording always wins</text>
<path d="M270,94 V106" class="line" marker-end="url(#ar)"/>
<rect x="20" y="106" width="500" height="44" rx="4" class="box" />
<circle cx="44" cy="128" r="11" fill="#026A9F"/><text x="44" y="132" text-anchor="middle" class="lbl" style="font-size:12px;font-weight:700;fill:#fff">2</text>
<text x="68" y="126" class="lbl title">Site RAMS for this service type</text>
<text x="68" y="142" class="lbl note">Approved version</text>
<path d="M270,150 V162" class="line" marker-end="url(#ar)"/>
<rect x="20" y="162" width="500" height="44" rx="4" class="box" />
<circle cx="44" cy="184" r="11" fill="#026A9F"/><text x="44" y="188" text-anchor="middle" class="lbl" style="font-size:12px;font-weight:700;fill:#fff">3</text>
<text x="68" y="182" class="lbl title">Site RAMS for all work at this site</text>
<text x="68" y="198" class="lbl note">Approved version</text>
<path d="M270,206 V218" class="line" marker-end="url(#ar)"/>
<rect x="20" y="218" width="500" height="44" rx="4" class="box" />
<circle cx="44" cy="240" r="11" fill="#026A9F"/><text x="44" y="244" text-anchor="middle" class="lbl" style="font-size:12px;font-weight:700;fill:#fff">4</text>
<text x="68" y="238" class="lbl title">Service contract's saved RAMS</text>
<path d="M270,262 V274" class="line" marker-end="url(#ar)"/>
<rect x="20" y="274" width="500" height="44" rx="4" class="box" />
<circle cx="44" cy="296" r="11" fill="#026A9F"/><text x="44" y="300" text-anchor="middle" class="lbl" style="font-size:12px;font-weight:700;fill:#fff">5</text>
<text x="68" y="294" class="lbl title">Service type template</text>
<path d="M270,318 V330" class="line" marker-end="url(#ar)"/>
<rect x="20" y="330" width="500" height="44" rx="4" class="box" stroke-dasharray="4 3"/>
<text x="68" y="350" class="lbl title">Blank</text>
<text x="68" y="366" class="lbl note">Nothing found, so you start from empty</text>
<rect x="550" y="50" width="190" height="96" rx="4" fill="#FBF0D9" stroke="#8A5A00"/>
<text x="566" y="78" class="lbl title" style="fill:#8A5A00">Only approved versions</text>
<text x="566" y="98" class="lbl body" style="fill:#8A5A00">are used. Drafts never.</text>
<text x="566" y="124" class="lbl note" style="fill:#8A5A00">Approve the site RAMS first.</text>
<text x="550" y="190" class="lbl note">The first source that has content</text><text x="550" y="206" class="lbl note">stops the search.</text>
</svg>
