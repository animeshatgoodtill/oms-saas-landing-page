<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" role="img" aria-labelledby="roleMatrixTitle roleMatrixDesc" font-family="Manrope, 'Source Sans 3', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="roleMatrixTitle">Opscel's 8 team roles, one line each</title>
  <desc id="roleMatrixDesc">Eight cards, one per Opscel role: Super Admin has full system access including billing and team management. Admin has full operational access except billing. Accounts has full invoicing and payments, view-only on customers and jobs. Contract Manager has full customers, quotes and certificates, view-only on invoices. Sales Manager has full quoting and account management, view-only on invoices. Site Manager has full job scheduling and certificates, no financial access. Engineer has field-only access to assigned jobs and certificates. Viewer has read-only access across customers, quotes, invoices and reports.</desc>

  <!-- surface -->
  <rect x="8" y="8" width="1024" height="544" rx="16" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1"/>

  <!-- header -->
  <rect x="8" y="8" width="1024" height="64" rx="16" fill="#F5F5F5"/>
  <rect x="8" y="56" width="1024" height="16" fill="#F5F5F5"/>
  <line x1="8" y1="72" x2="1032" y2="72" stroke="#E5E5E5" stroke-width="1"/>
  <text x="36" y="47" font-size="18" font-weight="700" fill="#171717">Opscel's 8 team roles</text>
  <text x="1004" y="47" text-anchor="end" font-size="11.5" fill="#737373">One purpose-built permission set per role</text>

  <!-- ═════════ Row 1 ═════════ -->
  <!-- Super Admin -->
  <g>
    <rect x="32" y="96" width="232" height="200" rx="12" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1"/>
    <rect x="32" y="96" width="6" height="200" rx="3" fill="#304FFF"/>
    <text x="56" y="126" font-size="14" font-weight="700" fill="#171717">Super Admin</text>
    <rect x="56" y="138" width="72" height="18" rx="9" fill="#304FFF"/>
    <text x="92" y="150.5" text-anchor="middle" font-size="9" font-weight="700" fill="#FFFFFF">FULL ACCESS</text>
    <text x="56" y="180" font-size="11" fill="#525252">Everything, including billing,</text>
    <text x="56" y="197" font-size="11" fill="#525252">integrations and team</text>
    <text x="56" y="214" font-size="11" fill="#525252">removal &#8212; the only role</text>
    <text x="56" y="231" font-size="11" fill="#525252">that can remove a user.</text>
  </g>

  <!-- Admin -->
  <g>
    <rect x="272" y="96" width="232" height="200" rx="12" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1"/>
    <rect x="272" y="96" width="6" height="200" rx="3" fill="#304FFF"/>
    <text x="296" y="126" font-size="14" font-weight="700" fill="#171717">Admin</text>
    <rect x="296" y="138" width="98" height="18" rx="9" fill="#EEF1FF"/>
    <text x="345" y="150.5" text-anchor="middle" font-size="9" font-weight="700" fill="#304FFF">ALL BUT BILLING</text>
    <text x="296" y="180" font-size="11" fill="#525252">Full operational access:</text>
    <text x="296" y="197" font-size="11" fill="#525252">customers, jobs, quotes,</text>
    <text x="296" y="214" font-size="11" fill="#525252">invoices, certificates, team.</text>
    <text x="296" y="231" font-size="11" fill="#525252">Can't manage billing.</text>
  </g>

  <!-- Accounts -->
  <g>
    <rect x="512" y="96" width="232" height="200" rx="12" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1"/>
    <rect x="512" y="96" width="6" height="200" rx="3" fill="#171717"/>
    <text x="536" y="126" font-size="14" font-weight="700" fill="#171717">Accounts</text>
    <rect x="536" y="138" width="110" height="18" rx="9" fill="#F5F5F5"/>
    <text x="591" y="150.5" text-anchor="middle" font-size="9" font-weight="700" fill="#525252">FINANCE-FOCUSED</text>
    <text x="536" y="180" font-size="11" fill="#525252">Full invoicing, payments</text>
    <text x="536" y="197" font-size="11" fill="#525252">and quoting. View-only on</text>
    <text x="536" y="214" font-size="11" fill="#525252">customers and the team</text>
    <text x="536" y="231" font-size="11" fill="#525252">directory; no certificates.</text>
  </g>

  <!-- Contract Manager -->
  <g>
    <rect x="752" y="96" width="232" height="200" rx="12" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1"/>
    <rect x="752" y="96" width="6" height="200" rx="3" fill="#171717"/>
    <text x="776" y="126" font-size="14" font-weight="700" fill="#171717">Contract Manager</text>
    <rect x="776" y="138" width="132" height="18" rx="9" fill="#F5F5F5"/>
    <text x="842" y="150.5" text-anchor="middle" font-size="9" font-weight="700" fill="#525252">CONTRACTS &amp; CERTS</text>
    <text x="776" y="180" font-size="11" fill="#525252">Full customers, quotes,</text>
    <text x="776" y="197" font-size="11" fill="#525252">purchase orders and service</text>
    <text x="776" y="214" font-size="11" fill="#525252">contracts; issues certificates.</text>
    <text x="776" y="231" font-size="11" fill="#525252">Invoices are view/create only.</text>
  </g>

  <!-- ═════════ Row 2 ═════════ -->
  <!-- Sales Manager -->
  <g>
    <rect x="32" y="312" width="232" height="200" rx="12" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1"/>
    <rect x="32" y="312" width="6" height="200" rx="3" fill="#171717"/>
    <text x="56" y="342" font-size="14" font-weight="700" fill="#171717">Sales Manager</text>
    <rect x="56" y="354" width="150" height="18" rx="9" fill="#F5F5F5"/>
    <text x="131" y="366.5" text-anchor="middle" font-size="9" font-weight="700" fill="#525252">QUOTES, NOT INVOICES</text>
    <text x="56" y="396" font-size="11" fill="#525252">Full quoting and account</text>
    <text x="56" y="413" font-size="11" fill="#525252">ownership. Can see whether</text>
    <text x="56" y="430" font-size="11" fill="#525252">an invoice was paid, but</text>
    <text x="56" y="447" font-size="11" fill="#525252">never creates or edits one.</text>
  </g>

  <!-- Site Manager -->
  <g>
    <rect x="272" y="312" width="232" height="200" rx="12" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1"/>
    <rect x="272" y="312" width="6" height="200" rx="3" fill="#171717"/>
    <text x="296" y="342" font-size="14" font-weight="700" fill="#171717">Site Manager</text>
    <rect x="296" y="354" width="140" height="18" rx="9" fill="#F5F5F5"/>
    <text x="366" y="366.5" text-anchor="middle" font-size="9" font-weight="700" fill="#525252">FIELD OPS, NO FINANCE</text>
    <text x="296" y="396" font-size="11" fill="#525252">Full job scheduling,</text>
    <text x="296" y="413" font-size="11" fill="#525252">assignment and certificate</text>
    <text x="296" y="430" font-size="11" fill="#525252">sign-off. No quotes, invoices</text>
    <text x="296" y="447" font-size="11" fill="#525252">or reports of any kind.</text>
  </g>

  <!-- Engineer -->
  <g>
    <rect x="512" y="312" width="232" height="200" rx="12" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1"/>
    <rect x="512" y="312" width="6" height="200" rx="3" fill="#FED835"/>
    <text x="536" y="342" font-size="14" font-weight="700" fill="#171717">Engineer</text>
    <rect x="536" y="354" width="100" height="18" rx="9" fill="#FFF8DE"/>
    <text x="586" y="366.5" text-anchor="middle" font-size="9" font-weight="700" fill="#8A6D00">FIELD APP ONLY</text>
    <text x="536" y="396" font-size="11" fill="#525252">Assigned jobs only, via the</text>
    <text x="536" y="413" font-size="11" fill="#525252">field app. Creates/edits (not</text>
    <text x="536" y="430" font-size="11" fill="#525252">issues) certificates. No admin</text>
    <text x="536" y="447" font-size="11" fill="#525252">dashboard, no pricing data.</text>
  </g>

  <!-- Viewer -->
  <g>
    <rect x="752" y="312" width="232" height="200" rx="12" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1"/>
    <rect x="752" y="312" width="6" height="200" rx="3" fill="#A3A3A3"/>
    <text x="776" y="342" font-size="14" font-weight="700" fill="#171717">Viewer</text>
    <rect x="776" y="354" width="100" height="18" rx="9" fill="#F5F5F5"/>
    <text x="826" y="366.5" text-anchor="middle" font-size="9" font-weight="700" fill="#525252">READ-ONLY</text>
    <text x="776" y="396" font-size="11" fill="#525252">Views customers, quotes,</text>
    <text x="776" y="413" font-size="11" fill="#525252">invoices, certificates and</text>
    <text x="776" y="430" font-size="11" fill="#525252">reports. Can't create, edit,</text>
    <text x="776" y="447" font-size="11" fill="#525252">or see jobs at all.</text>
  </g>

  <!-- footer note -->
  <line x1="32" y1="528" x2="1008" y2="528" stroke="#E5E5E5" stroke-width="1"/>
  <text x="32" y="548" font-size="10.5" fill="#737373">Roles are fixed &#8212; no custom roles. Full detail: the permission matrix table above.</text>
</svg>
