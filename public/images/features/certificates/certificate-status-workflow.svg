<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 480" role="img" aria-labelledby="certWfTitle certWfDesc" font-family="Manrope, 'Source Sans 3', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="certWfTitle">Certificate status workflow</title>
  <desc id="certWfDesc">A certificate is created as a Draft, editable while the engineer records test results. Marking it Completed locks the test data once every required field and signature is in place. Issuing assigns the permanent certificate number and makes the document immutable from that point on. From Issued there are two terminal outcomes: Voided, which keeps the original record with a written reason and no further edits, or Superseded, where a replacement certificate is issued and linked back to the one it replaces. Neither Voided nor Superseded certificates can be edited or deleted.</desc>

  <defs>
    <marker id="certWfArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#171717"/>
    </marker>
    <marker id="certWfArrowVoid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#DC2626"/>
    </marker>
    <marker id="certWfArrowSuper" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#304FFF"/>
    </marker>
  </defs>

  <!-- surface: the figure carries its own light ground so it reads on any page background -->
  <rect x="8" y="8" width="1024" height="464" rx="16" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1"/>

  <text x="500" y="46" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1.4" fill="#737373">ONE CERTIFICATE RECORD &#8212; EICR-000123</text>
  <path d="M48,68 L48,60 L952,60 L952,68" fill="none" stroke="#D4D4D4" stroke-width="1"/>

  <!-- ── main lane ── -->
  <!-- Draft -->
  <rect x="48" y="92" width="200" height="64" rx="10" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1"/>
  <circle cx="68" cy="116" r="5" fill="#A3A3A3"/>
  <text x="82" y="121" font-size="15" font-weight="700" fill="#171717">Draft</text>
  <text x="68" y="141" font-size="10.5" fill="#737373">editable &#183; test results in progress</text>

  <!-- Completed -->
  <rect x="308" y="92" width="200" height="64" rx="10" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1"/>
  <circle cx="328" cy="116" r="5" fill="#B58900"/>
  <text x="342" y="121" font-size="15" font-weight="700" fill="#171717">Completed</text>
  <text x="328" y="141" font-size="10.5" fill="#737373">all fields &#38; signatures present</text>

  <!-- Issued -->
  <rect x="568" y="92" width="200" height="64" rx="10" fill="#FFFFFF" stroke="#171717" stroke-width="2"/>
  <circle cx="588" cy="116" r="5" fill="#171717"/>
  <text x="602" y="121" font-size="15" font-weight="700" fill="#171717">Issued</text>
  <text x="588" y="141" font-size="10.5" fill="#737373">cert number assigned &#183; immutable</text>

  <!-- lane arrows -->
  <line x1="252" y1="124" x2="301" y2="124" stroke="#171717" stroke-width="1.6" marker-end="url(#certWfArrow)"/>
  <text x="276" y="110" text-anchor="middle" font-size="11" font-weight="700" fill="#525252">complete</text>
  <line x1="512" y1="124" x2="561" y2="124" stroke="#171717" stroke-width="1.6" marker-end="url(#certWfArrow)"/>
  <text x="536" y="110" text-anchor="middle" font-size="11" font-weight="700" fill="#525252">issue</text>

  <!-- ── terminal outcomes from Issued ── -->
  <line x1="668" y1="158" x2="668" y2="204" stroke="#DC2626" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#certWfArrowVoid)"/>
  <text x="678" y="184" font-size="10.5" font-weight="700" fill="#DC2626">void</text>

  <line x1="768" y1="140" x2="900" y2="140" stroke="#304FFF" stroke-width="1.4" stroke-dasharray="4 4"/>
  <line x1="900" y1="140" x2="900" y2="204" stroke="#304FFF" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#certWfArrowSuper)"/>
  <text x="820" y="128" font-size="10.5" font-weight="700" fill="#304FFF">supersede</text>

  <!-- Voided -->
  <rect x="568" y="220" width="200" height="72" rx="10" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.4"/>
  <circle cx="588" cy="244" r="5" fill="#DC2626"/>
  <text x="602" y="249" font-size="15" font-weight="700" fill="#171717">Voided</text>
  <text x="588" y="267" font-size="10.5" fill="#737373">written reason stored</text>
  <text x="588" y="281" font-size="10.5" fill="#737373">permanently &#183; terminal</text>

  <!-- Superseded -->
  <rect x="800" y="220" width="200" height="72" rx="10" fill="#FFFFFF" stroke="#304FFF" stroke-width="1.4"/>
  <circle cx="820" cy="244" r="5" fill="#304FFF"/>
  <text x="834" y="249" font-size="15" font-weight="700" fill="#171717">Superseded</text>
  <text x="820" y="267" font-size="10.5" fill="#737373">replacement certificate</text>
  <text x="820" y="281" font-size="10.5" fill="#737373">issued &#38; linked &#183; terminal</text>

  <!-- link from Superseded back to a new Issued record, illustrating the chain -->
  <path d="M900,292 L900,330 L668,330 L668,158" fill="none" stroke="#304FFF" stroke-width="1.1" stroke-dasharray="2 4"/>
  <text x="784" y="346" text-anchor="middle" font-size="10" fill="#737373">links back to the replacement certificate</text>

  <!-- ── immutability note ── -->
  <rect x="48" y="384" width="944" height="64" rx="10" fill="#FAFAFA" stroke="#E5E5E5" stroke-width="1"/>
  <path d="M76,406 a10,10 0 1 1 -0.01,0 Z" fill="none" stroke="#171717" stroke-width="1.4"/>
  <text x="76" y="410" text-anchor="middle" font-size="12" font-weight="700" fill="#171717">i</text>
  <text x="98" y="411" font-size="12.5" font-weight="700" fill="#171717">Once Issued, a certificate can never be edited or deleted.</text>
  <text x="98" y="429" font-size="11" fill="#737373">Correcting an error means voiding it (with a stored reason) or superseding it with a linked replacement &#8212; the original record always survives.</text>
</svg>
