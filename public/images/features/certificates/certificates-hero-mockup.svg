<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="certHeroTitle certHeroDesc">
  <title id="certHeroTitle">Certificate results, signatures and issued status</title>
  <desc id="certHeroDesc">A composite illustration of the certificate workspace: a circuit test-results table showing Zs readings with Pass and Warning result pills, a three-party signature strip for Designer, Constructor and Inspector each with a captured signature and confirmation check, and a floating "Issued" status chip with a lock icon indicating the certificate is now immutable.</desc>

  <defs>
    <linearGradient id="bgWash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F7F9FB"/>
      <stop offset="55%" stop-color="#F1F0FA"/>
      <stop offset="100%" stop-color="#E8E5F5"/>
    </linearGradient>

    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#141619" flood-opacity="0.14"/>
    </filter>
    <filter id="softShadowSmall" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#141619" flood-opacity="0.16"/>
    </filter>

    <clipPath id="clipMain">
      <rect x="0" y="0" width="680" height="440" rx="24"/>
    </clipPath>
    <clipPath id="clipSig">
      <rect x="0" y="0" width="600" height="240" rx="24"/>
    </clipPath>
  </defs>

  <!-- page wash behind the composite -->
  <rect x="0" y="0" width="1200" height="800" fill="url(#bgWash)"/>

  <!-- ambient soft blobs for depth -->
  <circle cx="150" cy="120" r="220" fill="#0280C4" opacity="0.05"/>
  <circle cx="1080" cy="700" r="260" fill="#E5A800" opacity="0.06"/>

  <!-- ============ SECONDARY PANEL: signature strip (placed first, sits behind main panel) ============ -->
  <g transform="translate(470,478)" filter="url(#softShadow)">
    <g clip-path="url(#clipSig)">
      <rect x="0" y="0" width="600" height="240" fill="#FFFFFF"/>
    </g>
    <rect x="0.5" y="0.5" width="599" height="239" rx="24" fill="none" stroke="#E5E7EB" stroke-width="1"/>

    <text x="28" y="38" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.6" fill="#6B7280">SIGN-OFF &#8212; BS 7671 EIC</text>
    <path d="M28,50 H572" stroke="#E5E7EB" stroke-width="1"/>

    <!-- three signature columns -->
    <!-- Designer -->
    <g transform="translate(28,68)">
      <text x="0" y="0" font-family="system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="0.6" fill="#141619">DESIGNER</text>
      <path d="M4,44 C 18,20 30,58 46,34 S 74,14 92,38 S 130,50 158,26" fill="none" stroke="#0280C4" stroke-width="2.4" stroke-linecap="round" opacity="0.85"/>
      <path d="M0,58 H164" stroke="#E5E7EB" stroke-width="1"/>
      <circle cx="150" cy="8" r="10" fill="#16A34A"/>
      <path d="M145,8 l3.4,3.6 L156,3" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="0" y="76" font-family="ui-monospace, monospace" font-size="10" fill="#6B7280">signed 09:14</text>
    </g>

    <!-- Constructor -->
    <g transform="translate(220,68)">
      <text x="0" y="0" font-family="system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="0.6" fill="#141619">CONSTRUCTOR</text>
      <path d="M4,30 C 20,50 34,10 50,32 S 80,54 100,28 S 138,16 158,40" fill="none" stroke="#0280C4" stroke-width="2.4" stroke-linecap="round" opacity="0.85"/>
      <path d="M0,58 H164" stroke="#E5E7EB" stroke-width="1"/>
      <circle cx="150" cy="8" r="10" fill="#16A34A"/>
      <path d="M145,8 l3.4,3.6 L156,3" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="0" y="76" font-family="ui-monospace, monospace" font-size="10" fill="#6B7280">signed 09:22</text>
    </g>

    <!-- Inspector -->
    <g transform="translate(412,68)">
      <text x="0" y="0" font-family="system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="0.6" fill="#141619">INSPECTOR</text>
      <path d="M4,36 C 16,12 32,52 48,26 S 78,10 96,36 S 132,52 158,24" fill="none" stroke="#0280C4" stroke-width="2.4" stroke-linecap="round" opacity="0.85"/>
      <path d="M0,58 H160" stroke="#E5E7EB" stroke-width="1"/>
      <circle cx="146" cy="8" r="10" fill="#16A34A"/>
      <path d="M141,8 l3.4,3.6 L152,3" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="0" y="76" font-family="ui-monospace, monospace" font-size="10" fill="#6B7280">signed 09:31</text>
    </g>

    <text x="28" y="222" font-family="system-ui, sans-serif" font-size="10.5" fill="#6B7280">All three parties captured &#8212; GPS &#183; IP &#183; timestamp attached to each signature</text>
  </g>

  <!-- ============ MAIN PANEL: circuit results table (dominant, overlaps top-left) ============ -->
  <g transform="translate(120,140)" filter="url(#softShadow)">
    <g clip-path="url(#clipMain)">
      <rect x="0" y="0" width="680" height="440" fill="#FFFFFF"/>
    </g>
    <rect x="0.5" y="0.5" width="679" height="439" rx="24" fill="none" stroke="#E5E7EB" stroke-width="1"/>

    <!-- panel header -->
    <text x="36" y="48" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.6" fill="#6B7280">ELECTRICAL INSTALLATION CERTIFICATE</text>
    <text x="36" y="76" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#141619">Circuit Test Results</text>
    <text x="644" y="72" text-anchor="end" font-family="ui-monospace, monospace" font-size="12" fill="#6B7280">EIC-0842</text>

    <path d="M36,96 H644" stroke="#E5E7EB" stroke-width="1"/>

    <!-- column headers -->
    <text x="36" y="120" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.1" fill="#6B7280">CIRCUIT</text>
    <text x="392" y="120" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.1" fill="#6B7280">ZS (&#937;)</text>
    <text x="500" y="120" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.1" fill="#6B7280">RESULT</text>
    <path d="M36,132 H644" stroke="#E5E7EB" stroke-width="1"/>

    <!-- Row 1 -->
    <text x="36" y="164" font-family="system-ui, sans-serif" font-size="14" fill="#141619">Ring Final Circuit 1</text>
    <text x="392" y="164" font-family="ui-monospace, monospace" font-size="14" fill="#141619">0.42</text>
    <g transform="translate(500,148)">
      <rect x="0" y="0" width="76" height="26" rx="13" fill="#16A34A" opacity="0.12"/>
      <circle cx="15" cy="13" r="7" fill="#16A34A"/>
      <path d="M11.5,13 l2.6,2.8 L19.5,9" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="30" y="17.5" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#16A34A">Pass</text>
    </g>
    <path d="M36,180 H644" stroke="#F1F3F5" stroke-width="1"/>

    <!-- Row 2 -->
    <text x="36" y="212" font-family="system-ui, sans-serif" font-size="14" fill="#141619">Lighting Circuit 2</text>
    <text x="392" y="212" font-family="ui-monospace, monospace" font-size="14" fill="#141619">1.15</text>
    <g transform="translate(500,196)">
      <rect x="0" y="0" width="76" height="26" rx="13" fill="#16A34A" opacity="0.12"/>
      <circle cx="15" cy="13" r="7" fill="#16A34A"/>
      <path d="M11.5,13 l2.6,2.8 L19.5,9" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="30" y="17.5" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#16A34A">Pass</text>
    </g>
    <path d="M36,228 H644" stroke="#F1F3F5" stroke-width="1"/>

    <!-- Row 3 (Warning, highlighted) -->
    <rect x="20" y="234" width="624" height="48" rx="12" fill="#F59E0B" opacity="0.06"/>
    <text x="36" y="262" font-family="system-ui, sans-serif" font-size="14" fill="#141619">Cooker Circuit</text>
    <text x="392" y="262" font-family="ui-monospace, monospace" font-size="14" font-weight="600" fill="#141619">1.30</text>
    <g transform="translate(500,246)">
      <rect x="0" y="0" width="100" height="26" rx="13" fill="#F59E0B" opacity="0.16"/>
      <path d="M15,6 L23,20 H7 Z" fill="none" stroke="#F59E0B" stroke-width="1.8" stroke-linejoin="round"/>
      <path d="M15,11 v4.4" stroke="#F59E0B" stroke-width="1.6" stroke-linecap="round"/>
      <circle cx="15" cy="17.6" r="0.9" fill="#F59E0B"/>
      <text x="32" y="17.5" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#B45309">Warning</text>
    </g>
    <path d="M36,282 H644" stroke="#F1F3F5" stroke-width="1"/>

    <!-- Row 4 -->
    <text x="36" y="314" font-family="system-ui, sans-serif" font-size="14" fill="#141619">Shower Circuit</text>
    <text x="392" y="314" font-family="ui-monospace, monospace" font-size="14" fill="#141619">0.68</text>
    <g transform="translate(500,298)">
      <rect x="0" y="0" width="76" height="26" rx="13" fill="#16A34A" opacity="0.12"/>
      <circle cx="15" cy="13" r="7" fill="#16A34A"/>
      <path d="M11.5,13 l2.6,2.8 L19.5,9" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="30" y="17.5" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#16A34A">Pass</text>
    </g>

    <path d="M36,340 H644" stroke="#E5E7EB" stroke-width="1"/>
    <text x="36" y="366" font-family="system-ui, sans-serif" font-size="10.5" fill="#6B7280">Zs limit auto-looked up from BS 7671 Table 41.4, temperature-corrected per circuit</text>

    <!-- footer meta -->
    <text x="36" y="410" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.1" fill="#6B7280">IR (M&#937;)</text>
    <text x="130" y="410" font-family="ui-monospace, monospace" font-size="13" fill="#141619">&gt;299</text>
    <text x="230" y="410" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.1" fill="#6B7280">RCD TRIP</text>
    <text x="330" y="410" font-family="ui-monospace, monospace" font-size="13" fill="#141619">21ms</text>
  </g>

  <!-- ============ FLOATING STATUS CHIP: Issued (overlaps main panel top-right corner) ============ -->
  <g transform="translate(716,104)" filter="url(#softShadowSmall)">
    <rect x="0" y="0" width="146" height="52" rx="26" fill="#FFFFFF"/>
    <rect x="0.5" y="0.5" width="145" height="51" rx="25.5" fill="none" stroke="#E5E7EB" stroke-width="1"/>
    <circle cx="27" cy="26" r="10" fill="#16A34A" opacity="0.14"/>
    <!-- lock icon -->
    <g transform="translate(20,19)">
      <rect x="0" y="6" width="14" height="10" rx="2.5" fill="none" stroke="#16A34A" stroke-width="1.8"/>
      <path d="M3,6 V3.6 A4,4 0 0 1 11,3.6 V6" fill="none" stroke="#16A34A" stroke-width="1.8" stroke-linecap="round"/>
    </g>
    <text x="48" y="31" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#16A34A">Issued</text>
  </g>

  <!-- small certificate-number tag pinned to the issued chip, monospace -->
  <g transform="translate(716,164)">
    <text x="0" y="0" font-family="ui-monospace, monospace" font-size="11" fill="#6B7280">#EIC-0842 &#183; locked</text>
  </g>
</svg>
