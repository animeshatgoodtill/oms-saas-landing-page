<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Composite illustration of Opscel defects: the office job page Defects card listing four defects by severity with a quote badge, a locked delete icon with its reason, Add defect and Create Bundled Quote buttons, beside a phone showing the engineer's defect form with severity, photos and parts.">
  <title>Opscel Defects — hero mockup</title>

  <defs>
    <linearGradient id="bgWash" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7F9FB"/>
      <stop offset="55%" stop-color="#F0F1FA"/>
      <stop offset="100%" stop-color="#E8E5F5"/>
    </linearGradient>
    <radialGradient id="blob1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D5D0F1" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#D5D0F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0280C4" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0280C4" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#141619" flood-opacity="0.14"/>
    </filter>
    <filter id="chipShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#141619" flood-opacity="0.16"/>
    </filter>
    <clipPath id="phoneScreen">
      <rect x="862" y="96" width="248" height="608" rx="30"/>
    </clipPath>
  </defs>

  <!-- page wash -->
  <rect x="0" y="0" width="1200" height="800" fill="url(#bgWash)"/>
  <circle cx="150" cy="120" r="220" fill="url(#blob1)"/>
  <circle cx="1080" cy="700" r="260" fill="url(#blob2)"/>
  <circle cx="1000" cy="90" r="150" fill="url(#blob1)"/>

  <!-- ===================== Panel A: office Defects card ===================== -->
  <g filter="url(#cardShadow)">
    <rect x="60" y="140" width="770" height="520" rx="24" fill="#FFFFFF"/>
  </g>
  <rect x="60" y="140" width="770" height="520" rx="24" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>

  <!-- card header -->
  <text x="92" y="178" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2" fill="#6B7280">JOB OVERVIEW · DEFECTS</text>
  <text x="92" y="204" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#141619">Defects (4 open)</text>
  <text x="92" y="224" font-family="system-ui, sans-serif" font-size="12.5" fill="#6B7280">Harbour View Care Home · Annual fire alarm service</text>

  <!-- Add defect (outline) -->
  <rect x="484" y="180" width="118" height="36" rx="10" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
  <line x1="502" y1="198" x2="512" y2="198" stroke="#141619" stroke-width="2" stroke-linecap="round"/>
  <line x1="507" y1="193" x2="507" y2="203" stroke="#141619" stroke-width="2" stroke-linecap="round"/>
  <text x="520" y="203" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#141619">Add defect</text>

  <!-- Create Bundled Quote (primary) -->
  <rect x="612" y="180" width="188" height="36" rx="10" fill="#0280C4"/>
  <rect x="630" y="190" width="12" height="16" rx="2" fill="none" stroke="#FFFFFF" stroke-width="1.6"/>
  <line x1="633" y1="195" x2="639" y2="195" stroke="#FFFFFF" stroke-width="1.4"/>
  <line x1="633" y1="199" x2="639" y2="199" stroke="#FFFFFF" stroke-width="1.4"/>
  <text x="650" y="203" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Create Bundled Quote</text>

  <line x1="92" y1="240" x2="800" y2="240" stroke="#E5E7EB" stroke-width="1"/>

  <!-- ── row 1: Critical ── -->
  <rect x="92" y="258" width="70" height="24" rx="12" fill="#DC2626" fill-opacity="0.12"/>
  <circle cx="105" cy="270" r="3.5" fill="#DC2626"/>
  <text x="113" y="274" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#B91C1C">Critical</text>
  <text x="172" y="274" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#6B7280">door</text>
  <text x="92" y="304" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#141619">Fire door closer failed, door does not self-close</text>
  <text x="92" y="324" font-family="system-ui, sans-serif" font-size="12.5" fill="#6B7280">Ground floor, stair core · 1 part</text>
  <rect x="92" y="334" width="104" height="22" rx="11" fill="#F59E0B" fill-opacity="0.14"/>
  <text x="144" y="349" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#B45309" text-anchor="middle">Quote required</text>
  <!-- photos -->
  <rect x="610" y="270" width="44" height="44" rx="8" fill="#E0ECF4"/>
  <rect x="624" y="279" width="16" height="28" rx="1.5" fill="none" stroke="#0280C4" stroke-width="1.8"/>
  <circle cx="636" cy="294" r="1.6" fill="#0280C4"/>
  <rect x="660" y="270" width="44" height="44" rx="8" fill="#E7EAEE"/>
  <rect x="672" y="282" width="20" height="8" rx="2" fill="#94A3B8"/>
  <line x1="682" y1="290" x2="682" y2="302" stroke="#94A3B8" stroke-width="2"/>
  <!-- actions -->
  <path d="M735 284 l10 -10 l5 5 l-10 10 h-5 z" fill="none" stroke="#6B7280" stroke-width="1.6" stroke-linejoin="round"/>
  <g stroke="#6B7280" stroke-width="1.6" fill="none" stroke-linecap="round">
    <line x1="766" y1="276" x2="784" y2="276"/>
    <path d="M771 276 v-3 h8 v3"/>
    <path d="M768 279 l1.5 13 h11 l1.5 -13"/>
  </g>
  <line x1="92" y1="372" x2="800" y2="372" stroke="#F1F3F5" stroke-width="1"/>

  <!-- ── row 2: Major, on a quote (delete locked) ── -->
  <rect x="92" y="388" width="62" height="24" rx="12" fill="#EA580C" fill-opacity="0.12"/>
  <circle cx="105" cy="400" r="3.5" fill="#EA580C"/>
  <text x="113" y="404" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#C2410C">Major</text>
  <text x="164" y="404" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#6B7280">detector</text>
  <text x="92" y="434" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#141619">Smoke detector head missing, base only</text>
  <text x="92" y="454" font-family="system-ui, sans-serif" font-size="12.5" fill="#6B7280">Level 2, Room 12 · Zone 3 · 1 part</text>
  <rect x="92" y="464" width="150" height="22" rx="11" fill="#0280C4" fill-opacity="0.12"/>
  <text x="167" y="479" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#0369A1" text-anchor="middle">QT-2026-0097 · Draft</text>
  <!-- photo -->
  <rect x="660" y="400" width="44" height="44" rx="8" fill="#E0ECF4"/>
  <circle cx="682" cy="420" r="11" fill="none" stroke="#0280C4" stroke-width="1.8"/>
  <circle cx="682" cy="420" r="3" fill="#0280C4" fill-opacity="0.5"/>
  <!-- actions: edit + greyed bin -->
  <path d="M735 414 l10 -10 l5 5 l-10 10 h-5 z" fill="none" stroke="#6B7280" stroke-width="1.6" stroke-linejoin="round"/>
  <g stroke="#D1D5DB" stroke-width="1.6" fill="none" stroke-linecap="round">
    <line x1="766" y1="406" x2="784" y2="406"/>
    <path d="M771 406 v-3 h8 v3"/>
    <path d="M768 409 l1.5 13 h11 l1.5 -13"/>
  </g>
  <line x1="92" y1="502" x2="800" y2="502" stroke="#F1F3F5" stroke-width="1"/>

  <!-- ── row 3: Minor ── -->
  <rect x="92" y="518" width="60" height="24" rx="12" fill="#F59E0B" fill-opacity="0.16"/>
  <circle cx="105" cy="530" r="3.5" fill="#D97706"/>
  <text x="113" y="534" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#B45309">Minor</text>
  <text x="162" y="534" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#6B7280">call point</text>
  <text x="92" y="564" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#141619">Manual call point glass cracked</text>
  <text x="92" y="584" font-family="system-ui, sans-serif" font-size="12.5" fill="#6B7280">Level 1, east corridor</text>
  <path d="M735 544 l10 -10 l5 5 l-10 10 h-5 z" fill="none" stroke="#6B7280" stroke-width="1.6" stroke-linejoin="round"/>
  <g stroke="#6B7280" stroke-width="1.6" fill="none" stroke-linecap="round">
    <line x1="766" y1="536" x2="784" y2="536"/>
    <path d="M771 536 v-3 h8 v3"/>
    <path d="M768 539 l1.5 13 h11 l1.5 -13"/>
  </g>
  <line x1="92" y1="604" x2="800" y2="604" stroke="#F1F3F5" stroke-width="1"/>

  <!-- ── row 4: Observation (condensed) ── -->
  <rect x="92" y="618" width="96" height="24" rx="12" fill="#64748B" fill-opacity="0.12"/>
  <circle cx="105" cy="630" r="3.5" fill="#64748B"/>
  <text x="113" y="634" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#475569">Observation</text>
  <text x="200" y="634" font-family="system-ui, sans-serif" font-size="13.5" font-weight="600" fill="#141619">Storage stacked in front of a sounder, plant room</text>

  <!-- tooltip on the greyed bin (row 2) -->
  <g filter="url(#chipShadow)">
    <rect x="470" y="330" width="326" height="52" rx="10" fill="#141619"/>
  </g>
  <path d="M768 382 l7 8 l7 -8 z" fill="#141619"/>
  <text x="486" y="352" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">This defect is on QT-2026-0097.</text>
  <text x="486" y="370" font-family="system-ui, sans-serif" font-size="12" fill="#D1D5DB">Remove it from the quote first.</text>

  <!-- ===================== Panel B: phone defect form ===================== -->
  <g filter="url(#cardShadow)">
    <rect x="850" y="84" width="272" height="632" rx="40" fill="#141619"/>
  </g>
  <rect x="862" y="96" width="248" height="608" rx="30" fill="#FFFFFF"/>
  <g clip-path="url(#phoneScreen)">
    <!-- status + app bar -->
    <rect x="862" y="96" width="248" height="78" fill="#F7F9FB"/>
    <rect x="964" y="106" width="44" height="10" rx="5" fill="#141619"/>
    <path d="M884 150 l-7 -7 l7 -7" fill="none" stroke="#141619" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="898" y="149" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#141619">Add defect</text>
    <line x1="862" y1="174" x2="1110" y2="174" stroke="#E5E7EB"/>

    <!-- severity -->
    <text x="880" y="198" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1" fill="#6B7280">SEVERITY</text>

    <rect x="880" y="208" width="212" height="40" rx="9" fill="#FFFFFF" stroke="#E5E7EB"/>
    <circle cx="898" cy="228" r="7" fill="none" stroke="#9CA3AF" stroke-width="1.6"/>
    <text x="914" y="225" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#141619">Observation</text>
    <text x="914" y="240" font-family="system-ui, sans-serif" font-size="10.5" fill="#6B7280">Advisory only</text>

    <rect x="880" y="254" width="212" height="40" rx="9" fill="#FFFFFF" stroke="#E5E7EB"/>
    <circle cx="898" cy="274" r="7" fill="none" stroke="#9CA3AF" stroke-width="1.6"/>
    <text x="914" y="271" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#141619">Minor</text>
    <text x="914" y="286" font-family="system-ui, sans-serif" font-size="10.5" fill="#6B7280">Next routine visit</text>

    <rect x="880" y="300" width="212" height="40" rx="9" fill="#EA580C" fill-opacity="0.08" stroke="#EA580C" stroke-width="1.5"/>
    <circle cx="898" cy="320" r="7" fill="none" stroke="#EA580C" stroke-width="1.8"/>
    <circle cx="898" cy="320" r="3.5" fill="#EA580C"/>
    <text x="914" y="317" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#141619">Major</text>
    <text x="914" y="332" font-family="system-ui, sans-serif" font-size="10.5" fill="#C2410C">Within 28 days</text>

    <rect x="880" y="346" width="212" height="40" rx="9" fill="#FFFFFF" stroke="#E5E7EB"/>
    <circle cx="898" cy="366" r="7" fill="none" stroke="#9CA3AF" stroke-width="1.6"/>
    <text x="914" y="363" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#141619">Critical</text>
    <text x="914" y="378" font-family="system-ui, sans-serif" font-size="10.5" fill="#6B7280">Immediate action</text>

    <!-- description -->
    <text x="880" y="410" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1" fill="#6B7280">DESCRIPTION</text>
    <rect x="880" y="418" width="212" height="46" rx="9" fill="#F9FAFB" stroke="#E5E7EB"/>
    <text x="892" y="437" font-family="system-ui, sans-serif" font-size="11.5" fill="#141619">Smoke detector head missing,</text>
    <text x="892" y="453" font-family="system-ui, sans-serif" font-size="11.5" fill="#141619">base only. Level 2, Room 12</text>

    <!-- photos -->
    <text x="880" y="488" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1" fill="#6B7280">PHOTOS</text>
    <rect x="880" y="496" width="52" height="52" rx="9" fill="#E0ECF4"/>
    <circle cx="906" cy="522" r="13" fill="none" stroke="#0280C4" stroke-width="1.8"/>
    <circle cx="906" cy="522" r="3.5" fill="#0280C4" fill-opacity="0.5"/>
    <rect x="940" y="496" width="72" height="24" rx="8" fill="#FFFFFF" stroke="#D1D5DB"/>
    <text x="976" y="512" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#141619" text-anchor="middle">Take photo</text>
    <rect x="940" y="524" width="72" height="24" rx="8" fill="#FFFFFF" stroke="#D1D5DB"/>
    <text x="976" y="540" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#141619" text-anchor="middle">Gallery</text>

    <!-- parts -->
    <text x="880" y="574" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1" fill="#6B7280">PARTS</text>
    <rect x="880" y="582" width="212" height="34" rx="9" fill="#FFFFFF" stroke="#D1D5DB" stroke-dasharray="4 3"/>
    <text x="986" y="603" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#0280C4" text-anchor="middle">+ Add a part</text>

    <!-- save -->
    <rect x="880" y="636" width="212" height="42" rx="10" fill="#FED835"/>
    <text x="986" y="662" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#141619" text-anchor="middle">Add defect</text>
  </g>
</svg>
