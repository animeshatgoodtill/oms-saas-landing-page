<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The Delete this defect? confirmation dialog: it explains the delete is for a defect raised by mistake, shows the defect's severity, description and location, offers a ticked option to also delete its 2 photos which can be restored for 30 days, warns the defect itself can't be restored, and has Keep it and Delete defect buttons. Side notes: resolved defects are part of the site's history, a defect on a quote must be removed from the quote first, and every delete is recorded in the audit log.">
  <title>Opscel — Delete this defect? dialog</title>

  <defs>
    <linearGradient id="bgWash" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7F9FB"/>
      <stop offset="55%" stop-color="#F0F1FA"/>
      <stop offset="100%" stop-color="#E8E5F5"/>
    </linearGradient>
    <radialGradient id="blob1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D5D0F1" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#D5D0F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#DC2626" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#DC2626" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#141619" flood-opacity="0.16"/>
    </filter>
    <filter id="chipShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#141619" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="800" fill="url(#bgWash)"/>
  <circle cx="180" cy="660" r="240" fill="url(#blob1)"/>
  <circle cx="620" cy="380" r="340" fill="url(#blob2)"/>
  <circle cx="1060" cy="120" r="180" fill="url(#blob1)"/>

  <!-- ===================== Dialog ===================== -->
  <g filter="url(#cardShadow)">
    <rect x="330" y="120" width="540" height="560" rx="22" fill="#FFFFFF"/>
  </g>
  <rect x="330" y="120" width="540" height="560" rx="22" fill="#FFFFFF" stroke="#E5E7EB"/>

  <!-- bin badge -->
  <circle cx="378" cy="172" r="22" fill="#DC2626" fill-opacity="0.10"/>
  <g stroke="#DC2626" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="369" y1="165" x2="387" y2="165"/>
    <path d="M374 165 v-3 h8 v3"/>
    <path d="M371 168 l1.5 13 h11 l1.5 -13"/>
  </g>
  <text x="414" y="180" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#141619">Delete this defect?</text>

  <text x="362" y="228" font-family="system-ui, sans-serif" font-size="15" fill="#374151">For a defect raised by mistake, such as on the wrong job.</text>
  <text x="362" y="250" font-family="system-ui, sans-serif" font-size="15" fill="#374151">It will be removed from this job, its job sheets and the</text>
  <text x="362" y="272" font-family="system-ui, sans-serif" font-size="15" fill="#374151">site's defect register.</text>

  <!-- defect summary -->
  <rect x="362" y="296" width="476" height="96" rx="12" fill="#F9FAFB" stroke="#E5E7EB"/>
  <rect x="382" y="314" width="60" height="24" rx="12" fill="#F59E0B" fill-opacity="0.16"/>
  <circle cx="395" cy="326" r="3.5" fill="#D97706"/>
  <text x="403" y="330" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#B45309">Minor</text>
  <text x="382" y="360" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#141619">Manual call point glass cracked</text>
  <text x="382" y="380" font-family="system-ui, sans-serif" font-size="13" fill="#6B7280">Level 1, east corridor</text>

  <!-- photos checkbox -->
  <rect x="362" y="418" width="20" height="20" rx="5" fill="#0280C4"/>
  <path d="M367 428 l4 4 l7 -8" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="394" y="433" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#141619">Also delete its 2 photos</text>
  <text x="394" y="456" font-family="system-ui, sans-serif" font-size="13" fill="#6B7280">Photos can be restored from the job's Photos for 30 days.</text>

  <!-- warning line -->
  <rect x="362" y="482" width="476" height="44" rx="10" fill="#DC2626" fill-opacity="0.06"/>
  <circle cx="384" cy="504" r="8" fill="none" stroke="#DC2626" stroke-width="1.6"/>
  <line x1="384" y1="499" x2="384" y2="505" stroke="#DC2626" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="384" cy="509" r="1.2" fill="#DC2626"/>
  <text x="402" y="509" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#B91C1C">The defect itself can't be restored.</text>

  <!-- buttons -->
  <line x1="330" y1="560" x2="870" y2="560" stroke="#F1F3F5"/>
  <rect x="566" y="590" width="120" height="48" rx="12" fill="#FFFFFF" stroke="#D1D5DB"/>
  <text x="626" y="620" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#141619" text-anchor="middle">Keep it</text>
  <rect x="698" y="590" width="140" height="48" rx="12" fill="#DC2626"/>
  <text x="768" y="620" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Delete defect</text>

  <!-- ===================== Side notes ===================== -->
  <!-- left: resolved -->
  <g filter="url(#chipShadow)">
    <rect x="40" y="170" width="250" height="118" rx="16" fill="#FFFFFF"/>
  </g>
  <rect x="40" y="170" width="250" height="118" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="60" y="190" width="78" height="24" rx="12" fill="#16A34A" fill-opacity="0.12"/>
  <circle cx="73" cy="202" r="3.5" fill="#16A34A"/>
  <text x="81" y="206" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#15803D">Resolved</text>
  <rect x="148" y="193" width="12" height="10" rx="2" fill="#6B7280"/>
  <path d="M150.5 193 v-3 a3.5 3.5 0 0 1 7 0 v3" fill="none" stroke="#6B7280" stroke-width="1.6"/>
  <text x="60" y="238" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#141619">Part of the site's history.</text>
  <text x="60" y="258" font-family="system-ui, sans-serif" font-size="12.5" fill="#6B7280">Can't be deleted. Re-open it</text>
  <text x="60" y="276" font-family="system-ui, sans-serif" font-size="12.5" fill="#6B7280">first if raised by mistake.</text>

  <!-- left: on a quote -->
  <g filter="url(#chipShadow)">
    <rect x="40" y="318" width="250" height="118" rx="16" fill="#FFFFFF"/>
  </g>
  <rect x="40" y="318" width="250" height="118" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="60" y="338" width="150" height="24" rx="12" fill="#0280C4" fill-opacity="0.12"/>
  <text x="135" y="354" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#0369A1" text-anchor="middle">QT-2026-0097</text>
  <rect x="220" y="341" width="12" height="10" rx="2" fill="#6B7280"/>
  <path d="M222.5 341 v-3 a3.5 3.5 0 0 1 7 0 v3" fill="none" stroke="#6B7280" stroke-width="1.6"/>
  <text x="60" y="386" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#141619">On a quote.</text>
  <text x="60" y="406" font-family="system-ui, sans-serif" font-size="12.5" fill="#6B7280">Remove it from the quote</text>
  <text x="60" y="424" font-family="system-ui, sans-serif" font-size="12.5" fill="#6B7280">first.</text>

  <!-- right: audit log -->
  <g filter="url(#chipShadow)">
    <rect x="910" y="440" width="250" height="118" rx="16" fill="#FFFFFF"/>
  </g>
  <rect x="910" y="440" width="250" height="118" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="930" y="460" width="28" height="28" rx="8" fill="#0280C4" fill-opacity="0.12"/>
  <line x1="937" y1="468" x2="951" y2="468" stroke="#0280C4" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="937" y1="474" x2="951" y2="474" stroke="#0280C4" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="937" y1="480" x2="946" y2="480" stroke="#0280C4" stroke-width="1.8" stroke-linecap="round"/>
  <text x="968" y="479" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#141619">Audit log</text>
  <text x="930" y="512" font-family="system-ui, sans-serif" font-size="12.5" fill="#6B7280">Every delete is recorded with</text>
  <text x="930" y="530" font-family="system-ui, sans-serif" font-size="12.5" fill="#6B7280">a full copy of the defect.</text>

  <!-- right: who can -->
  <g filter="url(#chipShadow)">
    <rect x="910" y="292" width="250" height="118" rx="16" fill="#FFFFFF"/>
  </g>
  <rect x="910" y="292" width="250" height="118" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
  <circle cx="944" cy="326" r="14" fill="#FED835"/>
  <circle cx="944" cy="322" r="4.5" fill="#141619"/>
  <path d="M936 334 a8 6 0 0 1 16 0" fill="#141619"/>
  <text x="968" y="331" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#141619">Who can delete</text>
  <text x="930" y="364" font-family="system-ui, sans-serif" font-size="12.5" fill="#6B7280">The person who raised it, or</text>
  <text x="930" y="382" font-family="system-ui, sans-serif" font-size="12.5" fill="#6B7280">the office. Not a colleague's.</text>
</svg>
