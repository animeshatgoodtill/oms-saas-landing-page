<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bgWash" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7F9FB"/>
      <stop offset="55%" stop-color="#EFEBFA"/>
      <stop offset="100%" stop-color="#E8E5F5"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#141619" flood-opacity="0.14"/>
    </filter>
    <filter id="softShadowSmall" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#141619" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- Page wash -->
  <rect x="0" y="0" width="1200" height="800" fill="url(#bgWash)"/>

  <!-- ============ DOMINANT PANEL: Invoice detail card ============ -->
  <g filter="url(#softShadow)">
    <rect x="230" y="150" width="640" height="470" rx="24" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  </g>

  <!-- Card header row -->
  <text x="270" y="205" font-family="system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="1.5" fill="#6B7280">INVOICE</text>
  <text x="270" y="236" font-family="ui-monospace, monospace" font-size="22" font-weight="700" fill="#141619">INV-2026-0142</text>

  <!-- Status pill: Paid -->
  <rect x="778" y="188" width="72" height="28" rx="14" fill="#16A34A" fill-opacity="0.12"/>
  <circle cx="796" cy="202" r="4" fill="#16A34A"/>
  <text x="806" y="206" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#16A34A">Paid</text>

  <!-- Divider -->
  <line x1="270" y1="258" x2="810" y2="258" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Meta row: customer / date -->
  <text x="270" y="284" font-family="system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="1.2" fill="#6B7280">BILLED TO</text>
  <text x="270" y="306" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#141619">Riverside Fire &amp; Security Ltd</text>

  <text x="600" y="284" font-family="system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="1.2" fill="#6B7280">ISSUED</text>
  <text x="600" y="306" font-family="ui-monospace, monospace" font-size="15" font-weight="600" fill="#141619">14 Aug 2026</text>

  <!-- Line items list -->
  <g font-family="system-ui, sans-serif" font-size="14" fill="#141619">
    <text x="270" y="356">Fire alarm annual service</text>
    <text x="810" y="356" text-anchor="end" font-family="ui-monospace, monospace">£420.00</text>
    <line x1="270" y1="372" x2="810" y2="372" stroke="#F1F3F5" stroke-width="1"/>

    <text x="270" y="404">Replacement smoke detectors ×6</text>
    <text x="810" y="404" text-anchor="end" font-family="ui-monospace, monospace">£312.50</text>
    <line x1="270" y1="420" x2="810" y2="420" stroke="#F1F3F5" stroke-width="1"/>

    <text x="270" y="452">Labour — 4.5 hrs</text>
    <text x="810" y="452" text-anchor="end" font-family="ui-monospace, monospace">£337.50</text>
    <line x1="270" y1="468" x2="810" y2="468" stroke="#F1F3F5" stroke-width="1"/>
  </g>

  <!-- Subtotal / VAT -->
  <text x="600" y="500" font-family="system-ui, sans-serif" font-size="13" fill="#6B7280">Subtotal</text>
  <text x="810" y="500" text-anchor="end" font-family="ui-monospace, monospace" font-size="13" fill="#6B7280">£2,372.92</text>
  <text x="600" y="522" font-family="system-ui, sans-serif" font-size="13" fill="#6B7280">VAT (20%)</text>
  <text x="810" y="522" text-anchor="end" font-family="ui-monospace, monospace" font-size="13" fill="#6B7280">£474.58</text>

  <line x1="270" y1="542" x2="810" y2="542" stroke="#E5E7EB" stroke-width="1.5"/>

  <!-- Hero total -->
  <text x="270" y="592" font-family="system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="1.2" fill="#6B7280">TOTAL DUE</text>
  <text x="270" y="628" font-family="ui-monospace, monospace" font-size="34" font-weight="700" fill="#141619">£2,847.50</text>

  <!-- Primary button suggestion -->
  <rect x="654" y="588" width="156" height="44" rx="12" fill="#0280C4"/>
  <text x="732" y="615" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#FAFAFA">View Invoice</text>

  <!-- ============ SYNC BADGE: floating chip overlapping top-right corner ============ -->
  <g filter="url(#softShadowSmall)">
    <rect x="742" y="108" width="188" height="56" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  </g>
  <circle cx="774" cy="136" r="14" fill="#16A34A" fill-opacity="0.14"/>
  <path d="M767 136.5 L772 141.5 L782 130.5" fill="none" stroke="#16A34A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="796" y="132" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" letter-spacing="0.8" fill="#6B7280">SYNCED TO</text>
  <text x="796" y="150" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#141619">Xero</text>

  <!-- ============ ACCENT STRIP: status pill row (floating card, lower-left, slight offset) ============ -->
  <g filter="url(#softShadow)">
    <rect x="140" y="655" width="560" height="94" rx="20" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  </g>
  <text x="172" y="686" font-family="system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="1.4" fill="#6B7280">INVOICE STATUS</text>

  <!-- Draft -->
  <rect x="172" y="700" width="82" height="28" rx="14" fill="#F1F3F5"/>
  <text x="213" y="719" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#6B7280">Draft</text>

  <!-- Posted -->
  <rect x="266" y="700" width="90" height="28" rx="14" fill="#0280C4" fill-opacity="0.12"/>
  <text x="311" y="719" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#0280C4">Posted</text>

  <!-- Paid -->
  <rect x="368" y="700" width="76" height="28" rx="14" fill="#16A34A" fill-opacity="0.12"/>
  <text x="406" y="719" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#16A34A">Paid</text>

  <!-- Partial -->
  <rect x="456" y="700" width="90" height="28" rx="14" fill="#F59E0B" fill-opacity="0.16"/>
  <text x="501" y="719" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#B45309">Partial</text>

  <!-- Voided (strikethrough cue) -->
  <rect x="558" y="700" width="86" height="28" rx="14" fill="#EF4444" fill-opacity="0.12"/>
  <text x="601" y="719" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#EF4444">Voided</text>
  <line x1="565" y1="714" x2="637" y2="714" stroke="#EF4444" stroke-width="1.4" stroke-opacity="0.55"/>

</svg>
