<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="jobsHeroTitle">
  <title id="jobsHeroTitle">Composite illustration of the job creation wizard, a job card, and a day planner strip</title>

  <defs>
    <linearGradient id="bgWash" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8E5F5"/>
      <stop offset="55%" stop-color="#EEF0F7"/>
      <stop offset="100%" stop-color="#F7F9FB"/>
    </linearGradient>

    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#141619" flood-opacity="0.14"/>
    </filter>
    <filter id="cardShadowSoft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#141619" flood-opacity="0.10"/>
    </filter>

    <style>
      .sans { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      .mono { font-family: ui-monospace, "SF Mono", "Roboto Mono", monospace; }
      .label { font-size: 12px; font-weight: 700; letter-spacing: 1.4px; fill: #6B7280; }
    </style>
  </defs>

  <!-- Page wash -->
  <rect x="0" y="0" width="1200" height="800" fill="url(#bgWash)"/>
  <circle cx="1120" cy="90" r="200" fill="#E5A800" opacity="0.08"/>
  <circle cx="70" cy="740" r="220" fill="#0280C4" opacity="0.07"/>

  <!-- ============ PLANNER STRIP (back layer) ============ -->
  <g filter="url(#cardShadowSoft)">
    <rect x="140" y="545" width="970" height="150" rx="20" fill="#FFFFFF"/>
  </g>
  <rect x="140" y="545" width="970" height="150" rx="20" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>

  <text x="172" y="578" class="sans label">TODAY&#8217;S PLANNER</text>
  <text x="1030" y="578" text-anchor="end" class="mono" font-size="13" font-weight="600" fill="#141619">31 AUG</text>

  <!-- time axis -->
  <line x1="172" y1="606" x2="1078" y2="606" stroke="#E5E7EB" stroke-width="1.5"/>
  <g class="mono" font-size="11" fill="#9CA3AF">
    <line x1="172" y1="602" x2="172" y2="610" stroke="#E5E7EB" stroke-width="1.5"/>
    <text x="172" y="624">09:00</text>
    <line x1="450" y1="602" x2="450" y2="610" stroke="#E5E7EB" stroke-width="1.5"/>
    <text x="450" y="624">11:00</text>
    <line x1="730" y1="602" x2="730" y2="610" stroke="#E5E7EB" stroke-width="1.5"/>
    <text x="730" y="624">13:00</text>
    <line x1="1010" y1="602" x2="1010" y2="610" stroke="#E5E7EB" stroke-width="1.5"/>
    <text x="1010" y="624">15:00</text>
  </g>

  <!-- visit chips -->
  <g>
    <rect x="172" y="636" width="248" height="46" rx="10" fill="#0280C4" opacity="0.10"/>
    <rect x="172" y="636" width="248" height="46" rx="10" fill="none" stroke="#0280C4" stroke-width="1.4"/>
    <circle cx="188" cy="659" r="4" fill="#0280C4"/>
    <text x="200" y="654" class="mono" font-size="11.5" font-weight="700" fill="#0280C4">09:00&#8211;10:30</text>
    <text x="200" y="670" class="sans" font-size="11.5" fill="#141619">Fitzgerald Ltd &#8212; Scheduled</text>
  </g>

  <g>
    <rect x="440" y="636" width="230" height="46" rx="10" fill="#E5A800" opacity="0.14"/>
    <rect x="440" y="636" width="230" height="46" rx="10" fill="none" stroke="#E5A800" stroke-width="1.4"/>
    <circle cx="456" cy="659" r="4" fill="#E5A800"/>
    <text x="468" y="654" class="mono" font-size="11.5" font-weight="700" fill="#946200">10:30&#8211;12:00</text>
    <text x="468" y="670" class="sans" font-size="11.5" fill="#141619">Unit 4 Retail Park &#8212; In Progress</text>
  </g>

  <g>
    <rect x="700" y="636" width="248" height="46" rx="10" fill="#16A34A" opacity="0.10"/>
    <rect x="700" y="636" width="248" height="46" rx="10" fill="none" stroke="#16A34A" stroke-width="1.4"/>
    <path d="M712 659 l4 4 l7 -8" stroke="#16A34A" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="730" y="654" class="mono" font-size="11.5" font-weight="700" fill="#16A34A">13:00&#8211;14:15</text>
    <text x="730" y="670" class="sans" font-size="11.5" fill="#141619">Riverside School &#8212; Completed</text>
  </g>

  <text x="1030" y="664" text-anchor="end" class="sans" font-size="11" font-weight="600" fill="#6B7280">+2 more</text>

  <!-- ============ WIZARD CARD (dominant panel) ============ -->
  <g filter="url(#cardShadow)">
    <rect x="70" y="60" width="680" height="470" rx="20" fill="#FFFFFF"/>
  </g>
  <rect x="70" y="60" width="680" height="470" rx="20" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>

  <text x="110" y="106" class="sans label">NEW JOB</text>
  <text x="110" y="138" class="sans" font-size="24" font-weight="800" fill="#141619">Job Details</text>

  <!-- 3-step progress -->
  <line x1="144" y1="192" x2="386" y2="192" stroke="#16A34A" stroke-width="3"/>
  <line x1="414" y1="192" x2="656" y2="192" stroke="#E5E7EB" stroke-width="3"/>

  <circle cx="130" cy="192" r="16" fill="#16A34A"/>
  <path d="M122 192 l6 6 l11 -13" stroke="#FFFFFF" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="130" y="222" text-anchor="middle" class="sans" font-size="11" font-weight="700" fill="#16A34A">CUSTOMER &amp; SITE</text>

  <circle cx="400" cy="192" r="17" fill="#0280C4"/>
  <text x="400" y="197" text-anchor="middle" class="sans" font-size="14" font-weight="800" fill="#FFFFFF">2</text>
  <text x="400" y="222" text-anchor="middle" class="sans" font-size="11" font-weight="800" fill="#0280C4">JOB DETAILS</text>

  <circle cx="670" cy="192" r="16" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.6"/>
  <text x="670" y="197" text-anchor="middle" class="sans" font-size="13" font-weight="700" fill="#9CA3AF">3</text>
  <text x="670" y="222" text-anchor="middle" class="sans" font-size="11" font-weight="700" fill="#9CA3AF">SCHEDULE</text>

  <!-- form fields -->
  <text x="110" y="264" class="sans label">JOB TYPE</text>
  <rect x="110" y="274" width="280" height="52" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.4"/>
  <text x="132" y="306" class="sans" font-size="15.5" font-weight="600" fill="#141619">Reactive Repair</text>
  <path d="M362 294 l7 8 l7 -8" stroke="#6B7280" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="420" y="264" class="sans label">PRIORITY</text>
  <rect x="420" y="274" width="280" height="52" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.4"/>
  <rect x="440" y="288" width="66" height="26" rx="13" fill="#F59E0B" opacity="0.16"/>
  <rect x="440" y="288" width="66" height="26" rx="13" fill="none" stroke="#F59E0B" stroke-width="1.4"/>
  <text x="473" y="305" text-anchor="middle" class="sans" font-size="12.5" font-weight="800" fill="#946200">High</text>
  <path d="M672 294 l7 8 l7 -8" stroke="#6B7280" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- description placeholder -->
  <text x="110" y="362" class="sans label">DESCRIPTION</text>
  <rect x="110" y="374" width="590" height="10" rx="5" fill="#F1F3F5"/>
  <rect x="110" y="392" width="590" height="10" rx="5" fill="#F1F3F5"/>
  <rect x="110" y="410" width="330" height="10" rx="5" fill="#F1F3F5"/>

  <!-- footer buttons -->
  <rect x="110" y="466" width="104" height="44" rx="12" fill="none" stroke="#E5E7EB" stroke-width="1.4"/>
  <text x="162" y="493" text-anchor="middle" class="sans" font-size="14" font-weight="700" fill="#141619">Back</text>

  <rect x="586" y="466" width="164" height="44" rx="12" fill="#0280C4"/>
  <text x="668" y="493" text-anchor="middle" class="sans" font-size="14" font-weight="700" fill="#FAFAFA">Continue</text>

  <!-- ============ JOB CARD (floating, top layer) ============ -->
  <g filter="url(#cardShadow)">
    <rect x="700" y="430" width="380" height="210" rx="20" fill="#FFFFFF"/>
  </g>
  <rect x="700" y="430" width="380" height="210" rx="20" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>

  <text x="730" y="472" class="mono" font-size="21" font-weight="800" fill="#141619">JOB-004821</text>

  <rect x="948" y="452" width="102" height="30" rx="15" fill="#0280C4" opacity="0.12"/>
  <rect x="948" y="452" width="102" height="30" rx="15" fill="none" stroke="#0280C4" stroke-width="1.4"/>
  <circle cx="963" cy="467" r="4" fill="#0280C4"/>
  <text x="1000" y="471" text-anchor="middle" class="sans" font-size="12" font-weight="800" fill="#0280C4">In Progress</text>

  <text x="730" y="500" class="sans" font-size="15" font-weight="600" fill="#141619">Meridian Fire &amp; Security Ltd</text>
  <text x="730" y="522" class="sans" font-size="12" fill="#6B7280">14 Bridge Street, Leeds</text>

  <!-- calendar icon -->
  <rect x="730" y="548" width="18" height="16" rx="3" fill="none" stroke="#6B7280" stroke-width="1.6"/>
  <line x1="730" y1="554" x2="748" y2="554" stroke="#6B7280" stroke-width="1.6"/>
  <line x1="734" y1="546" x2="734" y2="550" stroke="#6B7280" stroke-width="1.6"/>
  <line x1="744" y1="546" x2="744" y2="550" stroke="#6B7280" stroke-width="1.6"/>
  <text x="756" y="562" class="mono" font-size="13" font-weight="600" fill="#141619">12 Sep</text>

  <!-- clock icon -->
  <circle cx="862" cy="556" r="9" fill="none" stroke="#6B7280" stroke-width="1.6"/>
  <path d="M862 550 v6 l4 3" stroke="#6B7280" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <text x="880" y="562" class="mono" font-size="13" font-weight="600" fill="#141619">09:30</text>

  <line x1="730" y1="586" x2="1050" y2="586" stroke="#F1F3F5" stroke-width="1.4"/>
  <text x="730" y="612" class="sans" font-size="11.5" font-weight="700" fill="#6B7280">2 ENGINEERS ASSIGNED</text>
</svg>
