<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="qhTitle qhDesc">
  <title id="qhTitle">Good, Better, Recommended quote pricing tiers with a status stepper and customer accept panel</title>
  <desc id="qhDesc">A stylised composite of the OpsCel quotations product: three side-by-side pricing tier cards (Good, Better, Recommended) with the Better tier highlighted as most popular, a Draft to Sent to Viewed to Accepted status stepper, and a customer portal card with a drawn signature and Accept Quote / Decline buttons.</desc>

  <defs>
    <linearGradient id="bgWash" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7F9FB"/>
      <stop offset="55%" stop-color="#EFEBFA"/>
      <stop offset="100%" stop-color="#E8E5F5"/>
    </linearGradient>

    <filter id="shadowLg" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#141619" flood-opacity="0.14"/>
    </filter>
    <filter id="shadowMd" x="-40%" y="-40%" width="180%" height="200%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#141619" flood-opacity="0.14"/>
    </filter>
    <filter id="shadowSm" x="-40%" y="-40%" width="180%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#141619" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- page wash -->
  <rect x="0" y="0" width="1200" height="800" fill="url(#bgWash)"/>
  <circle cx="120" cy="700" r="220" fill="#D5D0F1" opacity="0.35"/>
  <circle cx="1120" cy="90" r="180" fill="#D5D0F1" opacity="0.3"/>

  <!-- ============ DOMINANT PANEL: GBB tier picker ============ -->
  <g filter="url(#shadowLg)">
    <rect x="150" y="196" width="860" height="422" rx="28" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  </g>

  <!-- panel header -->
  <text x="190" y="248" font-family="system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="1.5" fill="#6B7280">CHOOSE YOUR OPTION</text>
  <text x="970" y="248" text-anchor="end" font-family="ui-monospace, monospace" font-size="13" fill="#6B7280">QUO-2026-0142</text>
  <line x1="190" y1="266" x2="970" y2="266" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Tier card: GOOD -->
  <g>
    <rect x="190" y="300" width="260" height="298" rx="20" fill="#FAFAFA" stroke="#E5E7EB" stroke-width="1.5"/>
    <text x="320" y="336" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="2" fill="#6B7280">GOOD</text>
    <text x="320" y="380" text-anchor="middle" font-family="ui-monospace, monospace" font-size="30" font-weight="700" fill="#141619">&#163;1,240</text>
    <text x="320" y="406" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#6B7280"><tspan font-family="ui-monospace, monospace">6</tspan> items included</text>
    <line x1="214" y1="428" x2="426" y2="428" stroke="#E5E7EB" stroke-width="1"/>
    <g font-family="system-ui, sans-serif" font-size="12" fill="#141619">
      <circle cx="222" cy="456" r="7" fill="#16A34A" opacity="0.15"/>
      <path d="M218.5 456 L221 458.5 L225.5 452.5" stroke="#16A34A" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="236" y="460">Core repair &amp; parts</text>
      <circle cx="222" cy="482" r="7" fill="#16A34A" opacity="0.15"/>
      <path d="M218.5 482 L221 484.5 L225.5 478.5" stroke="#16A34A" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="236" y="486">12-month warranty</text>
    </g>
    <rect x="214" y="536" width="212" height="40" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <text x="320" y="561" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#141619">Select</text>
  </g>

  <!-- Tier card: BETTER (emphasised / most popular) -->
  <rect x="463" y="257" width="140" height="26" rx="13" fill="#E5A800"/>
  <text x="533" y="274" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="1" fill="#171717">MOST POPULAR</text>
  <g filter="url(#shadowMd)">
    <rect x="470" y="284" width="260" height="316" rx="20" fill="#FFFFFF" stroke="#E5A800" stroke-width="2.5"/>
  </g>
  <text x="600" y="322" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="2" fill="#B98600">BETTER</text>
  <text x="600" y="368" text-anchor="middle" font-family="ui-monospace, monospace" font-size="32" font-weight="700" fill="#141619">&#163;1,680</text>
  <text x="600" y="394" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#6B7280"><tspan font-family="ui-monospace, monospace">9</tspan> items included</text>
  <line x1="494" y1="416" x2="706" y2="416" stroke="#E5E7EB" stroke-width="1"/>
  <g font-family="system-ui, sans-serif" font-size="12" fill="#141619">
    <circle cx="502" cy="444" r="7" fill="#16A34A" opacity="0.15"/>
    <path d="M498.5 444 L501 446.5 L505.5 440.5" stroke="#16A34A" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="516" y="448">Everything in Good</text>
    <circle cx="502" cy="470" r="7" fill="#16A34A" opacity="0.15"/>
    <path d="M498.5 470 L501 472.5 L505.5 466.5" stroke="#16A34A" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="516" y="474">Priority scheduling</text>
  </g>
  <rect x="494" y="546" width="212" height="42" rx="10" fill="#0280C4"/>
  <text x="600" y="572" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#FAFAFA">Select</text>

  <!-- Tier card: RECOMMENDED -->
  <g>
    <rect x="750" y="300" width="260" height="298" rx="20" fill="#FAFAFA" stroke="#E5E7EB" stroke-width="1.5"/>
    <text x="880" y="336" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="2" fill="#6B7280">RECOMMENDED</text>
    <text x="880" y="380" text-anchor="middle" font-family="ui-monospace, monospace" font-size="30" font-weight="700" fill="#141619">&#163;2,150</text>
    <text x="880" y="406" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#6B7280"><tspan font-family="ui-monospace, monospace">14</tspan> items included</text>
    <line x1="774" y1="428" x2="986" y2="428" stroke="#E5E7EB" stroke-width="1"/>
    <g font-family="system-ui, sans-serif" font-size="12" fill="#141619">
      <circle cx="782" cy="456" r="7" fill="#16A34A" opacity="0.15"/>
      <path d="M778.5 456 L781 458.5 L785.5 452.5" stroke="#16A34A" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="796" y="460">Everything in Better</text>
      <circle cx="782" cy="482" r="7" fill="#16A34A" opacity="0.15"/>
      <path d="M778.5 482 L781 484.5 L785.5 478.5" stroke="#16A34A" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="796" y="486">24-month warranty</text>
    </g>
    <rect x="774" y="536" width="212" height="40" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <text x="880" y="561" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#141619">Select</text>
  </g>

  <!-- ============ ACCENT STRIP: status stepper (floating, overlapping top-left) ============ -->
  <g transform="rotate(-3 320 138)" filter="url(#shadowMd)">
    <rect x="90" y="100" width="460" height="76" rx="18" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  </g>
  <g transform="rotate(-3 320 138)" font-family="system-ui, sans-serif">
    <text x="114" y="128" font-size="10" font-weight="700" letter-spacing="1.5" fill="#6B7280">QUOTE STATUS</text>

    <!-- Draft -->
    <rect x="114" y="138" width="70" height="24" rx="12" fill="#F1F3F5"/>
    <text x="149" y="154" text-anchor="middle" font-size="11" font-weight="600" fill="#6B7280">Draft</text>
    <line x1="188" y1="150" x2="212" y2="150" stroke="#D1D5DB" stroke-width="1.5"/>

    <!-- Sent -->
    <rect x="216" y="138" width="70" height="24" rx="12" fill="#0280C4"/>
    <text x="251" y="154" text-anchor="middle" font-size="11" font-weight="600" fill="#FAFAFA">Sent</text>
    <line x1="290" y1="150" x2="314" y2="150" stroke="#D1D5DB" stroke-width="1.5"/>

    <!-- Viewed -->
    <rect x="318" y="138" width="80" height="24" rx="12" fill="#0280C4"/>
    <text x="358" y="154" text-anchor="middle" font-size="11" font-weight="600" fill="#FAFAFA">Viewed</text>
    <line x1="402" y1="150" x2="426" y2="150" stroke="#D1D5DB" stroke-width="1.5"/>

    <!-- Accepted -->
    <rect x="430" y="138" width="90" height="24" rx="12" fill="#16A34A"/>
    <text x="475" y="154" text-anchor="middle" font-size="11" font-weight="600" fill="#FFFFFF">Accepted</text>
  </g>

  <!-- ============ FLOATING CARD: customer portal accept / decline ============ -->
  <g transform="rotate(3 925 655)" filter="url(#shadowLg)">
    <rect x="760" y="560" width="330" height="192" rx="22" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  </g>
  <g transform="rotate(3 925 655)">
    <text x="788" y="592" font-family="system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="1.5" fill="#6B7280">CUSTOMER PORTAL</text>
    <text x="1062" y="592" text-anchor="end" font-family="ui-monospace, monospace" font-size="12" font-weight="600" fill="#141619">&#163;1,680</text>

    <!-- drawn signature squiggle -->
    <path d="M792 632 C 806 610, 818 654, 832 626 S 856 604, 866 630 S 892 648, 908 618 S 934 638, 950 624"
          fill="none" stroke="#0280C4" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
    <line x1="788" y1="646" x2="1062" y2="646" stroke="#E5E7EB" stroke-width="1"/>
    <text x="788" y="664" font-family="system-ui, sans-serif" font-size="10" fill="#6B7280">Signed to accept</text>

    <!-- buttons -->
    <rect x="788" y="688" width="118" height="40" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <text x="847" y="713" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#6B7280">Decline</text>

    <rect x="918" y="688" width="144" height="40" rx="10" fill="#0280C4"/>
    <text x="990" y="713" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#FAFAFA">Accept Quote</text>
  </g>
</svg>
