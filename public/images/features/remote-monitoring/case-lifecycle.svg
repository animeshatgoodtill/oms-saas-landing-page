<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 520" role="img" aria-labelledby="mcLifecycleTitle mcLifecycleDesc" font-family="Manrope, 'Source Sans 3', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="mcLifecycleTitle">Monitoring case lifecycle</title>
  <desc id="mcLifecycleDesc">A monitoring case opens, then optionally escalates to a job — escalation creates a real job with a visit and an engineer, but the case itself stays open and linked to that job rather than being closed automatically. Timeline entries append throughout, whether or not the case ever escalates. The case is closed manually once the underlying issue is resolved. A side note explains that the false alarm counter and the 90-day reinstatement clock are a separate, office-managed mechanism: the clock is a plain start date plus 90 days, and does not automatically extend itself if another false alarm happens inside the window.</desc>

  <defs>
    <marker id="mcArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#171717"/>
    </marker>
    <marker id="mcArrowMuted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#737373"/>
    </marker>
    <marker id="mcArrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#304FFF"/>
    </marker>
  </defs>

  <!-- surface: the figure carries its own light ground so it reads on any page background -->
  <rect x="8" y="8" width="1024" height="504" rx="16" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1"/>

  <!-- ── heading strip: it is ONE case throughout ── -->
  <text x="500" y="46" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1.4" fill="#737373">ONE MONITORING CASE &#8212; NOT A JOB</text>
  <path d="M48,68 L48,60 L952,60 L952,68" fill="none" stroke="#D4D4D4" stroke-width="1"/>

  <!-- ── state lane ── -->
  <!-- Case Opened -->
  <rect x="48" y="92" width="196" height="68" rx="10" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1"/>
  <circle cx="68" cy="116" r="5" fill="#304FFF"/>
  <text x="82" y="121" font-size="14.5" font-weight="700" fill="#171717">Case Opened</text>
  <text x="68" y="141" font-size="10" fill="#737373">from an ARC alert or</text>
  <text x="68" y="154" font-size="10" fill="#737373">keyholder contact</text>

  <!-- arrow to escalation decision -->
  <line x1="248" y1="126" x2="290" y2="126" stroke="#171717" stroke-width="1.6" marker-end="url(#mcArrow)"/>

  <!-- Escalated (optional) -->
  <rect x="296" y="92" width="220" height="68" rx="10" fill="#FFFFFF" stroke="#304FFF" stroke-width="1.6" stroke-dasharray="5 3"/>
  <circle cx="316" cy="116" r="5" fill="#304FFF"/>
  <text x="330" y="121" font-size="14.5" font-weight="700" fill="#171717">Escalated</text>
  <rect x="430" y="105" width="72" height="20" rx="10" fill="#EEF1FF"/>
  <text x="466" y="119" text-anchor="middle" font-size="9.5" font-weight="700" fill="#304FFF">OPTIONAL</text>
  <text x="316" y="141" font-size="10" fill="#737373">creates a linked job &#8212;</text>
  <text x="316" y="154" font-size="10" fill="#737373">visit, engineer, planner slot</text>

  <!-- arrow escalated -> case stays open -->
  <line x1="516" y1="126" x2="558" y2="126" stroke="#304FFF" stroke-width="1.6" marker-end="url(#mcArrowBlue)"/>
  <text x="537" y="112" text-anchor="middle" font-size="9.5" font-weight="700" fill="#304FFF">links, not closes</text>

  <!-- Case stays Open -->
  <rect x="564" y="92" width="196" height="68" rx="10" fill="#FAFAFA" stroke="#304FFF" stroke-width="1.6"/>
  <circle cx="584" cy="116" r="5" fill="#304FFF"/>
  <text x="598" y="121" font-size="14.5" font-weight="700" fill="#171717">Case stays Open</text>
  <text x="584" y="141" font-size="10" fill="#737373">nothing on the case is</text>
  <text x="584" y="154" font-size="10" fill="#737373">overwritten or auto-closed</text>

  <!-- bypass arrow: Opened straight down to timeline, skipping escalation -->
  <path d="M146,160 L146,196 L146,214" fill="none" stroke="#A3A3A3" stroke-width="1.3" stroke-dasharray="4 4" marker-end="url(#mcArrowMuted)"/>
  <text x="156" y="192" font-size="9.5" fill="#737373">resolved remotely &#8212; never escalates</text>

  <!-- arrow escalated/open row down to timeline -->
  <line x1="662" y1="160" x2="662" y2="214" stroke="#171717" stroke-width="1.4" marker-end="url(#mcArrow)"/>

  <!-- ── timeline row: append-only, spans full width ── -->
  <rect x="48" y="220" width="912" height="110" rx="12" fill="#F5F5F5" stroke="#E5E5E5" stroke-width="1"/>
  <text x="70" y="244" font-size="11" font-weight="700" letter-spacing="0.9" fill="#737373">CASE TIMELINE &#8212; APPEND-ONLY</text>

  <line x1="90" y1="285" x2="898" y2="285" stroke="#D4D4D4" stroke-width="1.4"/>
  <circle cx="90" cy="285" r="5" fill="#304FFF"/>
  <circle cx="270" cy="285" r="5" fill="#171717"/>
  <circle cx="450" cy="285" r="5" fill="#171717"/>
  <circle cx="662" cy="285" r="5" fill="#304FFF"/>
  <circle cx="850" cy="285" r="5" fill="#A3A3A3"/>

  <text x="90" y="270" text-anchor="middle" font-size="9.5" fill="#525252">alert received</text>
  <text x="270" y="270" text-anchor="middle" font-size="9.5" fill="#525252">ARC contacted</text>
  <text x="450" y="270" text-anchor="middle" font-size="9.5" fill="#525252">keyholder call</text>
  <text x="662" y="270" text-anchor="middle" font-size="9.5" fill="#304FFF" font-weight="700">escalation linked</text>
  <text x="850" y="270" text-anchor="middle" font-size="9.5" fill="#525252">note added</text>

  <text x="90" y="304" text-anchor="middle" font-size="9" fill="#A3A3A3">t+0</text>
  <text x="270" y="304" text-anchor="middle" font-size="9" fill="#A3A3A3">t+4m</text>
  <text x="450" y="304" text-anchor="middle" font-size="9" fill="#A3A3A3">t+9m</text>
  <text x="662" y="304" text-anchor="middle" font-size="9" fill="#A3A3A3">t+22m</text>
  <text x="850" y="304" text-anchor="middle" font-size="9" fill="#A3A3A3">t+3h</text>

  <text x="70" y="320" font-size="10" fill="#525252">Every contact, remote or on-site, appends to the same timeline &#8212; nothing here is ever replaced or removed.</text>

  <!-- arrow timeline -> closed -->
  <line x1="500" y1="330" x2="500" y2="356" stroke="#171717" stroke-width="1.4" marker-end="url(#mcArrow)"/>
  <text x="512" y="348" font-size="9.5" fill="#525252">closed manually, once resolved</text>

  <!-- Case Closed -->
  <rect x="404" y="362" width="196" height="60" rx="10" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1"/>
  <circle cx="424" cy="386" r="5" fill="#171717"/>
  <text x="438" y="391" font-size="14.5" font-weight="700" fill="#171717">Case Closed</text>
  <text x="424" y="408" font-size="10" fill="#737373">by a person, not a status rule</text>

  <!-- ── side note: false-alarm counter + 90-day reinstatement clock ── -->
  <rect x="48" y="440" width="912" height="64" rx="10" fill="#FFFBEB" stroke="#F0C94A" stroke-width="1"/>
  <text x="72" y="461" font-size="11" font-weight="700" fill="#92650A">SEPARATE MECHANISM &#8212; FALSE ALARMS &amp; THE 90-DAY REINSTATEMENT CLOCK</text>
  <text x="72" y="480" font-size="10.5" fill="#78530A">A false alarm on the arrangement is independent of any one case. The reinstatement clock is a plain start date + 90 days,</text>
  <text x="72" y="496" font-size="10.5" fill="#78530A">set once by your office &#8212; it does not automatically extend if another false alarm happens inside the window.</text>
</svg>
