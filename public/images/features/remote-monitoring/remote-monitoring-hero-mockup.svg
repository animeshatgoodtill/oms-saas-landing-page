  <text x="944" y="517" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#6B7280">Case closed</text>
  <text x="944" y="535" font-family="ui-monospace, monospace" font-size="11" fill="#9CA3AF">pending</text>

