  <text x="164" y="689" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#6B7280">3</text>
  <text x="190" y="681" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#141619">S. Marsh</text>
  <text x="190" y="699" font-family="ui-monospace, monospace" font-size="11" fill="#6B7280">07700 900035</text>
  <g transform="translate(384,674)">
    <circle r="12" fill="#F1F3F5"/>
    <path d="M-3.6 -4.4c0-.8.6-1.4 1.4-1.4h1.1c.6 0 1.1.4 1.2.9l.6 1.7c.2.5 0 1-.3 1.3l-.8.7c.6 1.4 1.7 2.5 3.1 3.1l.7-.8c.3-.3.8-.5 1.3-.3l1.7.6c.5.2.9.6.9 1.2v1.1c0 .8-.6 1.4-1.4 1.4h-.5C-0.3 5.1-4.6.8-4.6-4v-.4z" fill="#6B7280" stroke="none"/>
  </g>

  <!-- ============ ACCENT STRIP: append-only timeline (floating, right edge, vertical) ============ -->
  <g filter="url(#softShadow)">
    <rect x="890" y="200" width="232" height="380" rx="20" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  </g>
  <text x="916" y="236" font-family="system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="1.4" fill="#6B7280">CASE TIMELINE</text>
  <line x1="916" y1="248" x2="1096" y2="248" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Timeline spine -->
  <line x1="928" y1="276" x2="928" y2="520" stroke="#E5E7EB" stroke-width="2"/>

  <!-- Entry 1 -->
  <circle cx="928" cy="284" r="6" fill="#0280C4"/>
  <text x="944" y="281" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#141619">Signal received</text>
  <text x="944" y="299" font-family="ui-monospace, monospace" font-size="11" fill="#6B7280">08:14:02</text>

  <!-- Entry 2 -->
  <circle cx="928" cy="366" r="6" fill="#E5A800"/>
  <text x="944" y="363" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#141619">Keyholder called</text>
  <text x="944" y="381" font-family="ui-monospace, monospace" font-size="11" fill="#6B7280">08:19:47</text>

  <!-- Entry 3 -->
  <circle cx="928" cy="448" r="6" fill="#16A34A"/>
  <text x="944" y="445" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#141619">Attended, all clear</text>
  <text x="944" y="463" font-family="ui-monospace, monospace" font-size="11" fill="#6B7280">08:41:15</text>

  <!-- Entry 4 (pending, muted) -->
