  <text x="164" y="637" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#0280C4">2</text>
  <text x="190" y="629" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#141619">R. Okafor</text>
  <text x="190" y="647" font-family="ui-monospace, monospace" font-size="11" fill="#6B7280">07700 900487</text>
  <g transform="translate(384,622)">
