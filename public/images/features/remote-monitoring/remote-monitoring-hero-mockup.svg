<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bgWash" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7F9FB"/>
      <stop offset="55%" stop-color="#EFEBFA"/>
      <stop offset="100%" stop-color="#E8E5F5"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#141619" flood-opacity="0.14"/>
    </filter>
    <filter id="softShadowSmall" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#141619" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- Page wash -->
  <rect x="0" y="0" width="1200" height="800" fill="url(#bgWash)"/>

  <!-- ============ DOMINANT PANEL: Monitoring case card ============ -->
  <g filter="url(#softShadow)">
    <rect x="230" y="120" width="620" height="410" rx="24" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  </g>

  <!-- Card header row -->
  <text x="270" y="172" font-family="system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="1.5" fill="#6B7280">MONITORING CASE</text>
  <text x="270" y="203" font-family="ui-monospace, monospace" font-size="22" font-weight="700" fill="#141619">MC-00347</text>

  <!-- Status pill: Open -->
  <rect x="702" y="150" width="84" height="28" rx="14" fill="#0280C4" fill-opacity="0.12"/>
  <circle cx="720" cy="164" r="4" fill="#0280C4"/>
  <text x="730" y="168" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0280C4">Open</text>

