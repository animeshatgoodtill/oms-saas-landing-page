  <text x="270" y="274" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#141619">Northgate Retail Park — Unit 4</text>

  <text x="270" y="308" font-family="system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="1.2" fill="#6B7280">RESPONSE LEVEL</text>
  <g>
    <rect x="270" y="318" width="90" height="26" rx="13" fill="#F59E0B" fill-opacity="0.16"/>
    <text x="315" y="335" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#B45309">Level 3</text>
  </g>

  <text x="490" y="308" font-family="system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="1.2" fill="#6B7280">ARC ACCOUNT</text>
  <text x="490" y="334" font-family="ui-monospace, monospace" font-size="15" font-weight="600" fill="#141619">SEC-88213</text>

  <line x1="270" y1="362" x2="810" y2="362" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Signal detail rows -->
  <g font-family="system-ui, sans-serif" font-size="14" fill="#141619">
    <text x="270" y="396">Intruder signal — Zone 3, motion detector</text>
    <text x="810" y="396" text-anchor="end" font-family="ui-monospace, monospace" fill="#6B7280">08:14</text>
    <line x1="270" y1="412" x2="810" y2="412" stroke="#F1F3F5" stroke-width="1"/>

    <text x="270" y="444">Keyholder 1 contacted — attending</text>
    <text x="810" y="444" text-anchor="end" font-family="ui-monospace, monospace" fill="#6B7280">08:19</text>
  </g>

