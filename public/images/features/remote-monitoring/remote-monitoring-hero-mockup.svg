  <text x="286" y="486" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#6B7280">False alarms (90d):</text>
  <text x="470" y="486" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#141619">1 / 2</text>

