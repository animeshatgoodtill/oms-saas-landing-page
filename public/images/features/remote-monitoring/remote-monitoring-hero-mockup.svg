    <path d="M-4.5 -5.5c0-1 .8-1.8 1.8-1.8h1.4c.7 0 1.3.5 1.5 1.1l.7 2.1c.2.6 0 1.2-.4 1.6l-1 .9c.8 1.7 2.1 3.1 3.9 3.9l.9-1c.4-.4 1-.6 1.6-.4l2.1.7c.6.2 1.1.8 1.1 1.5v1.4c0 1-.8 1.8-1.8 1.8h-.6C-0.4 5.7-5.7.4-5.7-6v-.6z" fill="none" stroke="#6B7280" stroke-width="0" transform="translate(6,6) scale(0.8)"/>
    <path d="M-3.6 -4.4c0-.8.6-1.4 1.4-1.4h1.1c.6 0 1.1.4 1.2.9l.6 1.7c.2.5 0 1-.3 1.3l-.8.7c.6 1.4 1.7 2.5 3.1 3.1l.7-.8c.3-.3.8-.5 1.3-.3l1.7.6c.5.2.9.6.9 1.2v1.1c0 .8-.6 1.4-1.4 1.4h-.5C-0.3 5.1-4.6.8-4.6-4v-.4z" fill="#6B7280" stroke="none"/>
  </g>

