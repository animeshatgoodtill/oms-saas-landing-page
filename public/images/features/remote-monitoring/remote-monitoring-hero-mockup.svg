  <text x="190" y="577" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#141619">J. Whitfield</text>
  <text x="190" y="595" font-family="ui-monospace, monospace" font-size="11" fill="#6B7280">07700 900112</text>
  <g transform="translate(384,570)">
